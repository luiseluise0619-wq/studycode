name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: 엔진 (브라우저 없음)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/engine.test.cjs

  app:
    name: 앱 (브라우저)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - run: node tests/app.test.cjs
