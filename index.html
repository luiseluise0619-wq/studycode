<meta charset="utf-8" />
<title>코드런 · CodeRun</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="입문에서 시니어까지, 하나의 프로그램. 단계별 마일스톤(지식·직접 코딩·실무 판단·프로젝트)을 실제로 해내며 레벨업. SQL·Python·JS 브라우저 실행, 장애·설계 시뮬레이션." />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0e141c" id="theme-color-meta" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="코드런" />
<style>
  :root{
    --bg:#f3f5f7; --bg-soft:#e8ebef; --card:#ffffff; --ink:#0e141c; --ink-soft:#59636f;
    --line:#e3e7ec; --line-strong:#d2d7de;
    --brand:#2b54ff; --brand-ink:#1c3fd6;
    --good:#1f9d63; --good-soft:#e6f4ec; --bad:#e5484d; --bad-soft:#fceceb;
    --gold:#c98a00; --flame:#e2653a;
    --py:#3b7dd8; --sql:#1aa38a; --c:#6d7ba8; --cpp:#d6488f;
    --shadow:0 1px 2px rgba(14,20,28,.06);
    --radius:12px;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Code",Menlo,Consolas,monospace;
    --sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0d11; --bg-soft:#12151c; --card:#161a22; --ink:#eceff4; --ink-soft:#97a1b0;
      --line:#232834; --line-strong:#333a48;
      --brand:#5b7dff; --brand-ink:#3f5fe0;
      --good:#2fb673; --good-soft:#10301f; --bad:#f0575c; --bad-soft:#3a1618; --gold:#e0a838; --flame:#ef7448;
      --shadow:0 1px 2px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"]{
    --bg:#f3f5f7; --bg-soft:#e8ebef; --card:#ffffff; --ink:#0e141c; --ink-soft:#59636f;
    --line:#e3e7ec; --line-strong:#d2d7de; --brand:#2b54ff; --brand-ink:#1c3fd6;
    --good:#1f9d63; --good-soft:#e6f4ec; --bad:#e5484d; --bad-soft:#fceceb; --gold:#c98a00; --flame:#e2653a;
    --shadow:0 1px 2px rgba(14,20,28,.06);
  }
  :root[data-theme="dark"]{
    --bg:#0b0d11; --bg-soft:#12151c; --card:#161a22; --ink:#eceff4; --ink-soft:#97a1b0;
    --line:#232834; --line-strong:#333a48; --brand:#5b7dff; --brand-ink:#3f5fe0;
    --good:#2fb673; --good-soft:#10301f; --bad:#f0575c; --bad-soft:#3a1618; --gold:#e0a838; --flame:#ef7448;
    --shadow:0 1px 2px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.5;
    min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer}
  .app{max-width:560px; margin:0 auto; padding:0 16px 120px; position:relative}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; gap:10px; padding:14px 2px 12px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:19px; letter-spacing:-.02em; margin-right:auto}
  .brand .logo{width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--brand),#8a6bff);
    display:grid; place-items:center; color:#fff; font-family:var(--mono); font-weight:700; font-size:15px}
  .stat{display:flex; align-items:center; gap:5px; font-weight:800; font-size:15px; padding:5px 10px;
    border-radius:999px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow)}
  .stat .ic{font-size:16px; line-height:1}
  .stat.flame{color:var(--flame)} .stat.xp{color:var(--gold)}
  .heart-ic{color:var(--bad)}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
    box-shadow:var(--shadow); font-size:17px; display:grid; place-items:center; color:var(--ink); flex:0 0 auto}
  .stat{flex:0 0 auto} .rolechip .role-em{line-height:1}
  /* 좁은 화면: 상단바가 넘쳐 요소가 밀리는(탭 시 도망가는) 문제 방지 */
  @media (max-width:440px){
    .topbar{gap:6px; padding:12px 2px 10px}
    .brand{font-size:0; gap:0; margin-right:auto}
    .brand .logo{width:28px; height:28px; font-size:13px}
    .stat{padding:4px 8px; font-size:13px; gap:3px}
    .stat .ic{font-size:14px}
    .icon-btn{width:34px; height:34px; font-size:15px; border-radius:10px}
    .rolechip{padding:4px 8px; font-size:11px; gap:2px}
    .rolechip .rolename{display:none}
  }
  @media (max-width:340px){
    .rolechip{display:none}
    .brand{display:none}
    .topbar{gap:5px; justify-content:flex-end}
    .stat{padding:4px 7px}
  }

  /* ---------- language switch ---------- */
  .catbar{display:flex; flex-wrap:wrap; gap:6px; padding:12px 0 2px}
  .catchip{padding:7px 13px; border-radius:10px; border:2px solid var(--line); background:var(--card);
    font-weight:800; font-size:13px; color:var(--ink-soft); transition:transform .08s}
  .catchip:active{transform:scale(.97)}
  .catchip[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:transparent}
  .langbar{display:flex; flex-wrap:wrap; gap:7px; padding:8px 0 6px}
  .langchip{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:999px;
    border:2px solid var(--line); background:var(--card); font-weight:800; font-size:13px; color:var(--ink-soft);
    transition:transform .1s}
  .langchip .em{font-size:16px}
  .langchip[aria-selected="true"]{color:#fff; border-color:transparent}
  .langchip:active{transform:scale(.96)}

  /* ---------- practice bar ---------- */
  .lab-title{margin:16px 0 2px; font-size:15px; font-weight:900; color:var(--ink); letter-spacing:.02em}
  .practice-bar{display:flex; gap:8px; padding:6px 0 2px; flex-wrap:wrap}
  .pbtn.wrong{background:#fff2ef; border-color:#f2c4b8; color:#c0432c}
  .pbtn.wrong .badge{display:inline-block; min-width:18px; padding:0 5px; margin-left:5px; border-radius:9px;
    background:#e0533d; color:#fff; font-size:11px; line-height:18px; text-align:center; vertical-align:middle}
  :root[data-theme="dark"] .pbtn.wrong{background:#3a201a; border-color:#5c2f24; color:#ff9b84}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pbtn.wrong{background:#3a201a; border-color:#5c2f24; color:#ff9b84}}
  .pbtn{flex:1; min-width:30%; padding:12px 14px; border-radius:13px; border:2px solid var(--line); background:var(--card);
    font-weight:800; font-size:14px; color:var(--ink); box-shadow:var(--shadow); transition:transform .08s}
  .pbtn:active{transform:scale(.98)}
  #random-btn{background:var(--brand); border-color:transparent; color:#fff; box-shadow:0 3px 0 var(--brand-ink)}
  .pbtn.ghost[aria-pressed="true"]{background:var(--good); border-color:transparent; color:#fff; box-shadow:0 3px 0 #229e5a}

  /* ---------- unit header ---------- */
  .unit-head{margin:22px 0 4px; padding:16px 18px; border-radius:var(--radius); color:#fff;
    box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; gap:12px}
  .unit-head .k{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; opacity:.85}
  .unit-head h2{margin:2px 0 0; font-size:19px; font-weight:800; letter-spacing:-.01em}
  .unit-head .guide{font-size:22px}

  /* ---------- path ---------- */
  .path{display:flex; flex-direction:column; align-items:center; gap:10px; padding:20px 0 8px; position:relative}
  .node-wrap{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px}
  .node{
    width:74px; height:66px; border-radius:50%/58%; border:none; position:relative;
    background:var(--line-strong); box-shadow:0 6px 0 rgba(0,0,0,.14); color:#fff; font-size:26px;
    display:grid; place-items:center; transition:transform .12s, box-shadow .12s;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .node:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.14)}
  .node.locked{background:var(--bg-soft); color:var(--line-strong); box-shadow:0 5px 0 var(--line)}
  .node.done{}
  .node .crown{position:absolute; top:-12px; left:50%; transform:translateX(-50%); font-size:15px;
    filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
  .node.first-current::after{content:"시작"; position:absolute; top:-34px; left:50%; transform:translateX(-50%);
    background:var(--card); color:var(--brand); font-weight:800; font-size:11px; padding:4px 10px; border-radius:9px;
    border:1px solid var(--line); box-shadow:var(--shadow); white-space:nowrap}
  .node-label{font-size:12px; font-weight:700; color:var(--ink-soft); max-width:120px; text-align:center}
  /* 좌우 위치는 .node-wrap 이 맡는다. .node 의 transform 은 :active 눌림 전용 —
     같은 요소에 두면 누르는 순간 translateX 가 덮여 별이 원위치로 튀고 클릭이 빗나간다. */
  .node-wrap.n0{transform:translateX(0)} .node-wrap.n1{transform:translateX(64px)} .node-wrap.n2{transform:translateX(96px)}
  .node-wrap.n3{transform:translateX(64px)} .node-wrap.n4{transform:translateX(0)} .node-wrap.n5{transform:translateX(-64px)}
  .node-wrap.n6{transform:translateX(-96px)} .node-wrap.n7{transform:translateX(-64px)}
  @media (max-width:400px){
    .node-wrap.n1,.node-wrap.n3{transform:translateX(44px)} .node-wrap.n2{transform:translateX(66px)}
    .node-wrap.n5,.node-wrap.n7{transform:translateX(-44px)} .node-wrap.n6{transform:translateX(-66px)}
  }

  /* ---------- lesson view ---------- */
  .lesson{position:fixed; inset:0; background:var(--bg); z-index:50; display:none; flex-direction:column}
  .lesson.on{display:flex}
  .lesson-top{max-width:560px; width:100%; margin:0 auto; padding:16px 16px 8px; display:flex; align-items:center; gap:12px}
  .close-x{background:none; border:none; font-size:26px; color:var(--ink-soft); line-height:1; padding:0 4px}
  .pbar{flex:1; height:16px; border-radius:999px; background:var(--bg-soft); overflow:hidden; border:1px solid var(--line)}
  .pbar > i{display:block; height:100%; width:0; background:var(--good); border-radius:999px; transition:width .3s;
    box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
  .hearts{display:flex; align-items:center; gap:3px; font-weight:800; color:var(--bad)}
  .lesson-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; width:100%; max-width:560px; margin:0 auto;
    padding:18px 16px calc(var(--footh, 96px) + 22px + env(safe-area-inset-bottom, 0px))}
  .scrollhint{position:fixed; left:50%; z-index:51; bottom:calc(var(--footh, 96px) + 10px + env(safe-area-inset-bottom, 0px));
    padding:5px 13px; border-radius:20px; background:var(--card); border:1px solid var(--line);
    font-size:11.5px; font-weight:800; color:var(--ink-soft); box-shadow:var(--shadow); white-space:nowrap;
    opacity:0; pointer-events:none; transform:translateX(-50%) translateY(7px); transition:opacity .18s, transform .18s}
  .scrollhint.on{opacity:1; transform:translateX(-50%) translateY(0)}
  .codewrap{position:relative; padding-bottom:19px; margin:0 0 14px}
  .codewrap pre.code{margin-bottom:0}
  .codewrap:after{content:"→ 옆으로 밀어서 더 보기"; position:absolute; right:2px; bottom:0; padding:1px 9px; border-radius:20px;
    background:var(--card); border:1px solid var(--line); color:var(--ink-soft); font-size:10.5px; font-weight:800;
    font-family:var(--mono); pointer-events:none}
  .q-kind{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft)}
  .catbadge{display:inline-block; margin-bottom:8px; padding:4px 11px; border-radius:9px; color:#fff; font-size:12px; font-weight:800}
  .q-title{font-size:23px; font-weight:800; letter-spacing:-.01em; margin:8px 0 18px; text-wrap:balance; line-height:1.3}
  pre.code{font-family:var(--mono); font-size:14.5px; background:#0f1117; color:#e6e9f2; border-radius:14px;
    padding:16px 16px; overflow-x:auto; line-height:1.6; margin:0 0 20px; border:1px solid #22252f}
  pre.code .cm{color:#7f8aa3} pre.code .kw{color:#ff9ecb} pre.code .st{color:#a8e6a1} pre.code .nu{color:#ffc773}
  .options{display:flex; flex-direction:column; gap:10px}
  .opt{display:flex; align-items:center; gap:12px; text-align:left; padding:15px 16px; border-radius:14px;
    border:2px solid var(--line); background:var(--card); box-shadow:var(--shadow); font-size:16px; font-weight:600; color:var(--ink);
    transition:transform .08s}
  .opt:active{transform:scale(.99)}
  .opt .key{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;
    font-size:13px;font-weight:800;color:var(--ink-soft); flex:0 0 auto}
  .opt.sel{border-color:var(--brand); background:color-mix(in srgb,var(--brand) 10%,var(--card))}
  .opt.sel .key{border-color:var(--brand); color:var(--brand)}
  .opt.ok{border-color:var(--good); background:var(--good-soft)}
  .opt.no{border-color:var(--bad); background:var(--bad-soft)}
  .opt.mono{font-family:var(--mono); font-size:15px}
  .opt .ov{white-space:pre-wrap; overflow-wrap:anywhere; min-width:0}
  .opt.ws .ov{outline:1px dashed var(--line); border-radius:5px; padding:1px 4px} /* 공백이 유의미한 보기: 경계 표시 */
  /* ── 개념(이론) 화면 ── */
  .theory{max-width:640px; margin:0 auto}
  .th-badge{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--brand); background:color-mix(in srgb,var(--brand) 12%,transparent); border-radius:999px; padding:5px 11px}
  .th-title{font-size:22px; font-weight:900; letter-spacing:-.02em; margin:12px 0 4px; color:var(--ink); line-height:1.25}
  .th-sum{font-size:15.5px; font-weight:700; line-height:1.6; color:var(--ink); background:var(--bg-soft); border-left:3px solid var(--brand); border-radius:0 10px 10px 0; padding:12px 14px; margin:14px 0}
  .th-h{font-size:15px; font-weight:800; color:var(--ink); margin:18px 0 6px; letter-spacing:-.01em}
  .th-p{font-size:14.5px; line-height:1.72; color:var(--ink-soft); margin:6px 0}
  .theory .code{margin:12px 0}
  .th-cap{font-size:12.5px; line-height:1.6; color:var(--ink-soft); margin:-4px 0 10px; font-style:italic}
  .th-key{margin:18px 0 4px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--card)}
  .th-key-t{font-family:var(--mono); font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--good); margin-bottom:6px}
  .th-key ul{margin:0; padding-left:18px}
  .th-key li{font-size:14px; line-height:1.66; color:var(--ink); margin:3px 0}
  .th-p code.ic, .th-key code.ic, .th-sum code.ic{font-family:var(--mono); font-size:.9em; background:var(--bg-soft); border:1px solid var(--line); border-radius:5px; padding:1px 5px; color:var(--ink)}
  /* ── 코드 리뷰 (다중 선택 결함 찾기) ── */
  .rev-hint{font-size:12.5px; color:var(--ink-soft); margin:6px 2px 8px}
  .rev-list{display:flex; flex-direction:column; gap:8px; margin-top:6px}
  .revopt{display:flex; align-items:flex-start; gap:11px; text-align:left; padding:13px 14px; border-radius:12px; border:2px solid var(--line); background:var(--card); font-size:14.5px; font-weight:600; color:var(--ink); box-shadow:var(--shadow); line-height:1.5}
  .revopt .revbox{flex:0 0 auto; width:22px; height:22px; border-radius:6px; border:2px solid var(--line); display:grid; place-items:center; font-size:13px; font-weight:900; color:transparent; margin-top:1px}
  .revopt.sel{border-color:var(--brand); background:color-mix(in srgb,var(--brand) 9%,var(--card))}
  .revopt.sel .revbox{background:var(--brand); border-color:var(--brand); color:#fff}
  .revopt.rev-hit{border-color:var(--good); background:var(--good-soft)}
  .revopt.rev-hit .revbox{background:var(--good); border-color:var(--good); color:#fff}
  .revopt.rev-bad{border-color:var(--good)}                 /* 놓친 실제 결함 */
  .revopt.rev-bad .revbox{border-color:var(--good); color:var(--good)}
  .revopt.rev-wrong{border-color:var(--bad); background:var(--bad-soft)}  /* 오탐 */
  .revopt.rev-wrong .revbox{background:var(--bad); border-color:var(--bad); color:#fff}
  .revtag{display:inline-block; font-family:var(--mono); font-size:10px; font-weight:800; letter-spacing:.05em; padding:1px 6px; border-radius:6px; margin-left:6px}
  .revtag.t-bad{background:var(--good-soft); color:var(--good)}
  .revtag.t-ok{background:var(--bad-soft); color:var(--bad)}
  .fill-in{width:100%; padding:15px 16px; border-radius:14px; border:2px solid var(--line); background:var(--card);
    font-family:var(--mono); font-size:16px; color:var(--ink); box-shadow:var(--shadow)}
  .fill-in:focus{outline:none; border-color:var(--brand)}
  .kbbar{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  .ksym{min-width:40px; padding:10px 0; flex:0 0 auto; border-radius:10px; border:1px solid var(--line);
    background:var(--card); font-family:var(--mono); font-size:17px; font-weight:800; color:var(--ink); box-shadow:var(--shadow)}
  .ksym:active{background:var(--brand); color:#fff; border-color:transparent}

  /* ---------- footer check ---------- */
  .foot{position:fixed; left:0; right:0; bottom:0; border-top:2px solid var(--line); background:var(--bg);
    transition:background .2s, border-color .2s}
  .foot-in{max-width:560px; margin:0 auto; padding:16px; display:flex; align-items:center; gap:14px}
  .foot .msg{flex:1; display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px}
  .foot .msg .em{font-size:26px}
  .foot .msg small{display:block; font-weight:600; font-size:13px; color:var(--ink-soft); margin-top:2px}
  .foot.good{background:var(--good-soft); border-color:var(--good)} .foot.good .msg{color:var(--good)}
  .foot.bad{background:var(--bad-soft); border-color:var(--bad)} .foot.bad .msg{color:var(--bad)}
  .btn{border:none; border-radius:14px; padding:15px 26px; font-weight:800; font-size:16px; color:#fff;
    background:var(--brand); box-shadow:0 4px 0 var(--brand-ink); transition:transform .08s, box-shadow .08s; letter-spacing:.01em}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--brand-ink)}
  .btn:disabled{background:var(--line-strong); box-shadow:0 4px 0 var(--line); color:var(--bg); cursor:not-allowed}
  .btn.good{background:var(--good); box-shadow:0 4px 0 #229e5a}
  .btn.bad{background:var(--bad); box-shadow:0 4px 0 #d94747}
  .btn.wide{width:100%}

  /* ---------- complete ---------- */
  .done-view{position:fixed; inset:0; z-index:60; background:var(--bg); display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px}
  .done-view.on{display:flex}
  .done-view .big{font-size:64px; animation:pop .5s ease}
  @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .done-view h1{font-size:28px; font-weight:800; margin:10px 0 6px}
  .done-view p{color:var(--ink-soft); font-weight:600; margin:0 0 26px}
  .rewards{display:flex; gap:14px; margin-bottom:30px}
  .reward{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:14px 22px; box-shadow:var(--shadow)}
  .reward .rv{font-size:22px; font-weight:800} .reward .rl{font-size:12px; font-weight:800; text-transform:uppercase;
    letter-spacing:.06em; color:var(--ink-soft); margin-top:2px}
  .reward.xp .rv{color:var(--gold)} .reward.flame .rv{color:var(--flame)}

  /* ---------- playground / lab ---------- */
  .lab-cta{width:100%; margin:4px 0 2px; padding:14px; border-radius:14px; border:none; color:#fff; font-weight:800;
    font-size:15px; background:linear-gradient(135deg,#5b6cff,#8a6bff); box-shadow:0 4px 0 var(--brand-ink); transition:transform .08s}

  .labrun{background:#1aa38a; color:#fff} .labcheck{background:#5b6cff; color:#fff} .labsol{background:var(--card); color:var(--ink); border:1px solid var(--line)!important}

  /* ============================================================
     DESIGN REFRESH — cool-graphite engineering identity
     (flat accents, near-black CTAs, tighter radii, mono eyebrows)
     ============================================================ */
  .app{max-width:600px}
  .topbar{padding:16px 2px 12px; border-bottom:1px solid var(--line)}
  .brand{letter-spacing:-.03em}
  .brand .logo{background:var(--brand); border-radius:8px; font-weight:800}
  .stat{border-radius:9px; box-shadow:none; border:1px solid var(--line); font-variant-numeric:tabular-nums; font-size:14px}
  .icon-btn{border-radius:9px; box-shadow:none}
  .rolechip{border-radius:8px; box-shadow:none}
  /* primary actions: confident solid ink (light: dark btn / dark: light btn), no gradient/chunky shadow */
  .btn{background:var(--ink); color:var(--bg); box-shadow:none; border-radius:10px; letter-spacing:0}
  .btn:active{transform:translateY(1px); box-shadow:none}
  .btn:disabled{background:var(--line-strong); color:var(--card); box-shadow:none}
  .btn.good{background:var(--good); color:#fff; box-shadow:none}
  .btn.bad{background:var(--bad); color:#fff; box-shadow:none}
  #random-btn{background:var(--ink); border-color:transparent; color:var(--bg); box-shadow:none; border-radius:11px}
  .pbtn{border-radius:11px; box-shadow:none; border:1px solid var(--line)}
  .pbtn.ghost[aria-pressed="true"]{background:var(--ink); color:var(--bg); box-shadow:none}
  .ovclose, .mstart, .pjstartbtn{background:var(--ink); color:var(--bg); box-shadow:none; border-radius:10px}
  .labcheck, .labnext, .labrun{box-shadow:none; border-radius:10px}
  .labcheck, .labnext{background:var(--ink); color:var(--bg)}
  .labrun{background:var(--good); color:#fff}
  .lab-cta{background:var(--brand); box-shadow:none; border-radius:12px}
  .lab-cta:active{transform:translateY(1px); box-shadow:none}
  /* chips: squarer, hairline, flat active */
  .catchip, .langchip{border-radius:8px; border-width:1px; box-shadow:none}
  .catchip[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:transparent}
  .langchip[aria-selected="true"]{background:var(--brand); color:#fff; border-color:transparent}
  /* cards & inputs: hairline + micro shadow, tighter radius */
  .daily, .rnode, .simcard, .pjcard, .opt, .fill-in, .ovcard, .simctx, .phgoal, .accbox{box-shadow:var(--shadow)}
  .opt{border-radius:12px}
  .opt.sel{border-color:var(--brand); background:color-mix(in srgb, var(--brand) 8%, var(--card))}
  .opt.sel .key{border-color:var(--brand); color:var(--brand)}
  .unit-head{border-radius:var(--radius); box-shadow:none}
  /* eyebrows / labels → monospace, engineering register */
  .q-kind, .unit-head .k, .lab-title, .simstep, .reward .rl, .roadmap .rtitle, .simh, .dglabel{font-family:var(--mono); letter-spacing:.04em}
  .lab-title{text-transform:uppercase; font-size:12px; color:var(--ink-soft); font-weight:700; margin:20px 0 4px}
  .q-title, .unit-head h2, .ovcard h2, .done-view h1{letter-spacing:-.02em; text-wrap:balance}
  .catbadge{border-radius:7px; font-family:var(--mono); letter-spacing:.02em}
  /* progress fills: flat brand */
  .dbar > i, .pbar > i, .rnode .rp > i, .skill .sb > i{background:var(--brand)}
  /* rolebox: flat, refined */
  .rolebox{background:var(--brand); border-radius:var(--radius)}
  /* lesson path: squircle tiles, restrained shadow (less candy) */
  .node{border-radius:28%; box-shadow:0 3px 0 rgba(0,0,0,.10)}
  .node:active{box-shadow:0 1px 0 rgba(0,0,0,.10)}
  .node.locked{box-shadow:0 3px 0 var(--line)}
  .node.current::after{border-radius:7px; box-shadow:var(--shadow); font-family:var(--mono)}
  /* focus visibility for keyboard users */
  a:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
  /* roadmap header: wrap gracefully instead of breaking the title */
  .roadmap .rtitle{flex-wrap:wrap; gap:8px; align-items:center}
  .roadmap .rtitle > span:first-child{flex:1 1 60%; min-width:0}
  .roadmap .rtitle > span:last-child{display:flex; gap:6px; flex:0 0 auto; flex-wrap:wrap}
  .roadmap .rtitle button{white-space:nowrap; border-radius:8px; font-family:var(--mono); font-size:11px}
  /* curriculum / onboarding goal buttons: flat, tighter */
  .goalbtn{border-radius:11px; box-shadow:var(--shadow)}
  .goalbtn:active{border-color:var(--brand)}

  /* ============================================================
     PRODUCT REDESIGN — hero-led home, career-telemetry identity
     8px rhythm · monospace data · progressive disclosure
     ============================================================ */
  .app{max-width:600px; padding:0 20px 120px}
  /* slim, quiet topbar — wordmark + two controls only */
  .topbar{gap:12px; padding:18px 0 14px; border-bottom:1px solid var(--line)}
  .brand{display:flex; align-items:center; gap:9px; margin-right:auto; font-size:0}
  .brand .logo{width:30px; height:30px; border-radius:8px; background:var(--ink); color:var(--bg);
    display:grid; place-items:center; font-family:var(--mono); font-weight:700; font-size:14px}
  .wordmark{font-size:18px; font-weight:800; letter-spacing:-.03em; color:var(--ink)}
  .navbtn{background:none; border:1px solid var(--line); border-radius:9px; padding:8px 13px;
    font-weight:700; font-size:13px; color:var(--ink); letter-spacing:-.01em}
  .navbtn:active{background:var(--bg-soft)}
  @media (max-width:380px){ .wordmark{font-size:0} .brand .logo{margin-right:0} }

  /* ---------- HERO: the signature "career instrument" ---------- */
  #hero{margin:22px 0 6px}
  .hero-card{display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:22px 22px 20px; border:1px solid var(--line); border-radius:16px; background:var(--card);
    box-shadow:var(--shadow); position:relative; overflow:hidden}
  .hero-l{min-width:0}
  .eyebrow{font-family:var(--mono); text-transform:uppercase; font-size:10.5px; letter-spacing:.14em;
    color:var(--ink-soft); margin-bottom:6px}
  .hero-tier{display:flex; align-items:center; gap:9px; font-size:27px; font-weight:800; letter-spacing:-.03em;
    color:var(--ink); line-height:1.05}
  .hero-tier .ht-em{font-size:24px}
  .hero-lvl{margin-top:7px; color:var(--ink-soft); font-size:13px}
  .hero-lvl .hl-num{font-size:16px; font-weight:800; color:var(--ink)}
  .hero-next{margin-top:3px; font-size:12.5px; color:var(--ink-soft)}
  .hero-next b{color:var(--ink); font-weight:800}
  .hero-stats{display:flex; gap:20px; margin-top:16px}
  .hstat{display:flex; flex-direction:column; gap:1px}
  .hstat .hs-n{font-size:18px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1.1}
  .hstat .hs-l{font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft)}
  .hero-radar{flex:0 0 auto; background:none; border:none; padding:0; cursor:pointer; line-height:0}
  .hero-radar svg{width:150px !important; max-width:150px !important; margin:0 !important}
  .hero-radar text{display:none}
  .hero-radar:active{transform:scale(.98)}
  .mono{font-family:var(--mono)}
  .radar-poly{transform-box:fill-box; transform-origin:center; animation:radarIn .7s cubic-bezier(.2,.85,.25,1) both}
  @keyframes radarIn{from{opacity:0; transform:scale(.55)} to{opacity:1; transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){ .radar-poly{animation:none} }
  @media (max-width:430px){
    .hero-card{padding:18px 18px 16px; gap:8px}
    .hero-tier{font-size:23px}
    .hero-radar svg{width:118px !important; max-width:118px !important}
    .hero-stats{gap:16px}
  }
  .hero-cta{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:12px;
    padding:16px; border:none; border-radius:13px; background:var(--ink); color:var(--bg);
    font-weight:800; font-size:16px; letter-spacing:-.01em; cursor:pointer; transition:transform .08s}
  .hero-cta .cta-arrow{transition:transform .18s}
  .hero-cta:hover .cta-arrow{transform:translateX(3px)}
  .hero-cta:active{transform:translateY(1px)}
  .hero-cta-sub{text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:8px}

  /* ---------- daily: quiet strip, not a card ---------- */
  .daily{padding:16px 0; margin:6px 0 0; background:none; border:none; border-top:1px solid var(--line); border-radius:0; box-shadow:none}
  .daily .dtop{font-size:13px; margin-bottom:8px}
  .daily .dtop span:first-child{font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em; font-size:11px; color:var(--ink-soft); font-weight:700}
  .daily .dtop .done{font-variant-numeric:tabular-nums}
  .dbar{height:6px}

  /* ---------- roadmap rail: your path ---------- */
  .roadmap{margin:20px 0 2px}
  .roadmap .rtitle{font-size:13px}
  .roadmap .rtitle > span:first-child{font-family:var(--mono); text-transform:uppercase; letter-spacing:.06em; font-size:12px; color:var(--ink-soft); font-weight:700}
  .rnode{min-width:104px; border-radius:12px}
  .rnode.active{border-color:var(--brand); border-width:2px}

  /* ---------- exploration: collapsed by default (kills the feature-list feel) ---------- */
  .explore{margin:18px 0 2px; border-top:1px solid var(--line)}
  .explore > summary{list-style:none; cursor:pointer; padding:15px 2px; display:flex; align-items:center; justify-content:space-between;
    font-family:var(--mono); text-transform:uppercase; letter-spacing:.08em; font-size:11.5px; font-weight:700; color:var(--ink-soft)}
  .explore > summary::-webkit-details-marker{display:none}
  .explore > summary::after{content:"＋"; font-family:var(--sans); font-size:17px; color:var(--ink-soft)}
  .explore[open] > summary::after{content:"−"}
  .explore .catbar{padding-top:2px}

  /* ---------- section eyebrow (typographic, hairline divider) ---------- */
  .section-eyebrow{font-family:var(--mono); text-transform:uppercase; font-size:11px; letter-spacing:.1em;
    color:var(--ink-soft); font-weight:700; margin:24px 0 10px; padding-top:18px; border-top:1px solid var(--line)}
  /* practice tools: quiet secondary actions */
  .practice-bar{gap:8px}
  .pbtn{font-size:13.5px; padding:12px}
  .foot-hint{position:static; background:none; border:none; margin-top:26px; padding:18px 0 0; border-top:1px solid var(--line); font-size:12px}

  /* ---------- onboarding: branded welcome (first impression) ---------- */
  #onboard .ovcard{padding:24px 22px}
  .onb-logo{display:inline-flex; align-items:center; gap:8px; font-weight:800; font-size:16px; letter-spacing:-.03em; margin-bottom:16px; color:var(--ink)}
  .onb-mk{width:28px; height:28px; border-radius:7px; background:var(--ink); color:var(--bg); display:grid; place-items:center; font-family:var(--mono); font-weight:700; font-size:13px}
  .onb-title{font-size:24px; font-weight:800; letter-spacing:-.03em; line-height:1.28; margin:0 0 10px; text-wrap:balance; color:var(--ink)}
  #onboard .sub{font-size:13.5px; line-height:1.6}
  .onb-eyebrow{font-family:var(--mono); text-transform:uppercase; font-size:10.5px; letter-spacing:.12em; color:var(--ink-soft); font-weight:700; margin:20px 0 10px}
  .goalbtn{align-items:center}
  .goalbtn .go-arrow{margin-left:auto; color:var(--ink-soft); font-weight:800; font-size:15px}
  .goalbtn:hover{border-color:var(--brand)}
  .goalbtn:hover .go-arrow{color:var(--brand)}

  /* ---------- lesson complete: restrained celebration ---------- */
  .done-view .big{font-size:52px}
  .done-view h1{font-size:26px; font-weight:800; letter-spacing:-.02em}
  .done-view p{font-size:14px}
  .reward{border-radius:14px; box-shadow:var(--shadow)}
  .reward .rv{font-variant-numeric:tabular-nums}
  .reward .rl{font-family:var(--mono); letter-spacing:.04em}

  /* ---------- overlay screens: unified product chrome ---------- */
  .ovh{font-family:var(--mono); text-transform:uppercase; font-size:11px; letter-spacing:.1em;
    color:var(--ink-soft); font-weight:700; margin:2px 0 6px}
  .ovtitle{font-size:22px; font-weight:800; letter-spacing:-.03em; color:var(--ink); margin:0 0 6px; line-height:1.15}
  #profile-body h2, #aiov-body h2{font-size:22px; font-weight:800; letter-spacing:-.03em; margin:2px 0 6px}
  /* secondary (bordered) variant of the primary action button — kills inline color tells */
  .ovclose.alt{background:var(--card); color:var(--ink); border:1px solid var(--line)}
  .ovclose.alt:active{background:var(--bg-soft)}
  /* ---------- 성장 로드맵 (시니어까지 통합 경로) ---------- */
  .pstage{border:1px solid var(--line); border-radius:14px; padding:14px 15px; margin-top:10px; background:var(--card); position:relative}
  .pstage.done{opacity:.72}
  .pstage.active{border-color:var(--brand); border-width:2px; box-shadow:var(--shadow)}
  .pstage-h{display:flex; align-items:center; gap:8px; font-size:16px}
  .pstage-h b{font-weight:800; letter-spacing:-.02em}
  .pstage-em{font-size:18px}
  .pstage-gate{font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); letter-spacing:.04em}
  .pstage-chk{margin-left:auto; font-size:12px; font-weight:800; color:var(--good)}
  .pstage-now{margin-left:auto; font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--brand); font-weight:800}
  .pstage-focus{font-weight:700; font-size:13.5px; margin:8px 0 4px; color:var(--ink)}
  .pstage-what{font-size:12.5px; line-height:1.6; color:var(--ink-soft)}
  .pstage-bar{height:6px; border-radius:4px; background:var(--line); overflow:hidden; margin:10px 0 2px}
  .pstage-bar>i{display:block; height:100%; background:var(--brand)}
  .pathbtns{display:flex; flex-wrap:wrap; gap:7px; margin-top:10px}
  .pathbtn{border:1px solid var(--line); background:var(--bg-soft); color:var(--ink); border-radius:9px; padding:8px 12px; font-size:12.5px; font-weight:700; cursor:pointer}
  .pathbtn:hover{border-color:var(--brand); color:var(--brand)}
  /* mastery requirement checklist */
  .preqs{margin-top:11px; display:flex; flex-direction:column; gap:2px}
  .preq{display:flex; align-items:center; gap:9px; padding:8px 4px; border-top:1px solid var(--line); cursor:pointer; text-align:left; background:none; width:100%}
  .preq:first-child{border-top:none}
  .preq-ic{flex:0 0 auto; width:19px; height:19px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:900; color:var(--ink-soft)}
  .preq.ok .preq-ic{background:var(--good); border-color:var(--good); color:#fff}
  .preq-main{flex:1 1 auto; min-width:0}
  .preq-lbl{font-size:12.7px; font-weight:700; color:var(--ink); line-height:1.35}
  .preq.ok .preq-lbl{color:var(--ink-soft)}
  .preq-mini{height:4px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:5px}
  .preq-mini>i{display:block; height:100%; background:var(--brand)}
  .preq.ok .preq-mini>i{background:var(--good)}
  .preq-n{flex:0 0 auto; font-family:var(--mono); font-size:11px; font-weight:800; color:var(--ink-soft)}
  .preq-go{flex:0 0 auto; color:var(--ink-soft); font-weight:800; font-size:13px}
  .preq:hover .preq-go{color:var(--brand)}
  .pstage.locked{opacity:.55}
  .pstage.locked .preq{cursor:default}
  .path-prog{border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0 2px; background:var(--bg-soft)}
  .path-prog-t{display:flex; justify-content:space-between; align-items:baseline; font-weight:800; font-size:13.5px}
  .path-prog-n{font-family:var(--mono); color:var(--brand)}
  .path-prog-bar{height:8px; border-radius:5px; background:var(--line); overflow:hidden; margin-top:9px; display:flex; gap:3px}
  .path-prog-bar>i{flex:1; background:var(--line)}
  .path-prog-bar>i.on{background:var(--brand)}
  .path-prog-bar>i.cur{background:var(--brand); opacity:.45}
  .path-cta{display:flex; align-items:center; gap:8px; width:100%; margin-top:10px; padding:13px 15px; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); font-weight:800; font-size:14px; cursor:pointer}
  .path-cta:hover{border-color:var(--brand)}
  .path-cta .pc-go{margin-left:auto; color:var(--ink-soft); font-weight:800}
  .path-cta:hover .pc-go{color:var(--brand)}

  /* hub navigation rows — replaces stacked colored buttons */
  .hubrow{display:flex; align-items:center; gap:12px; width:100%; padding:15px 16px; margin-top:8px;
    border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink);
    font-weight:700; font-size:14.5px; text-align:left; cursor:pointer; transition:border-color .12s}
  .hubrow:hover{border-color:var(--brand)}
  .hubrow .hb-em{font-size:19px; line-height:1; flex:0 0 auto}
  .hubrow .hb-t{display:flex; flex-direction:column; gap:2px; min-width:0}
  .hubrow .hb-s{font-size:12px; color:var(--ink-soft); font-weight:500; white-space:normal; line-height:1.4}
  .hubrow .hb-go{margin-left:auto; color:var(--ink-soft); font-weight:800; font-size:15px; flex:0 0 auto}
  .hubrow:hover .hb-go{color:var(--brand)}
  /* SQL result: theme-aware surface (was hardcoded dark) */
  .sqltbl{border-collapse:collapse; white-space:nowrap}
  .sqltbl th{text-align:left; padding:2px 12px 5px 0; border-bottom:1px solid var(--ink-soft);
    font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft)}
  .sqltbl td{padding:3px 12px 3px 0; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
  .sql-meta{color:var(--ink-soft); font-size:11.5px; margin-top:5px; font-family:var(--mono)}
  .sql-err{color:#e0533d; font-weight:600}
  .sql-wait{color:var(--ink-soft); font-family:var(--mono); font-size:12px}

  /* ---------- flatten primary actions: one ink CTA language, no chunky 3D / gradients ---------- */
  .btn{background:var(--ink); color:var(--bg); box-shadow:none; border-radius:12px; letter-spacing:-.01em; transition:transform .08s, background .12s}
  .btn:active{transform:translateY(1px); box-shadow:none}
  .btn:disabled{background:var(--line-strong); color:var(--bg); box-shadow:none}
  .btn.good{background:var(--good); color:#fff; box-shadow:none}
  .btn.bad{background:var(--bad); color:#fff; box-shadow:none}
  .lab-cta{background:var(--ink); color:var(--bg); box-shadow:none; border-radius:12px}
  .lab-cta:active{transform:translateY(1px); box-shadow:none}
  #random-btn{background:var(--ink); color:var(--bg); border-color:transparent; box-shadow:none}
  .pbtn.ghost[aria-pressed="true"]{box-shadow:none}
  .node{box-shadow:0 2px 0 rgba(0,0,0,.07)}
  .node:active{box-shadow:0 1px 0 rgba(0,0,0,.07)}
  .node.locked{box-shadow:0 2px 0 var(--line)}

  /* ---------- designed toast (replaces informational alert()) ---------- */
  .toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px); z-index:120;
    max-width:min(440px,calc(100vw - 32px)); padding:13px 18px; border-radius:12px;
    background:var(--ink); color:var(--bg); font-size:13.5px; font-weight:600; line-height:1.5;
    box-shadow:0 8px 30px rgba(0,0,0,.22); opacity:0; pointer-events:none; text-align:center;
    transition:opacity .22s, transform .22s}
  .toast.on{opacity:1; transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){ .toast{transition:opacity .2s} }
  /* ---------- designed confirm modal (replaces confirm()) ---------- */
  .confirm-ovl{align-items:center; justify-content:center; padding:24px; z-index:140}
  .confirm-card{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:24px 22px 18px; width:100%; max-width:360px; box-shadow:0 20px 60px rgba(0,0,0,.28)}
  .confirm-msg{font-size:15px; font-weight:600; line-height:1.6; color:var(--ink); white-space:pre-line}
  .confirm-actions{display:flex; gap:10px; margin-top:20px}
  .confirm-actions button{flex:1; padding:13px; border-radius:11px; font-weight:800; font-size:14.5px; cursor:pointer}
  .confirm-no{background:var(--card); color:var(--ink); border:1px solid var(--line)}
  .confirm-no:active{background:var(--bg-soft)}
  .confirm-yes{background:var(--ink); color:var(--bg); border:none}
  .confirm-yes.danger{background:var(--bad)}
  .confirm-yes:active{transform:translateY(1px)}

  /* ---------- AI mentor (V4 — BYOK code review) ---------- */
  .ai-field{display:flex; flex-direction:column; gap:6px; margin:14px 0}
  .ai-field label{font-family:var(--mono); text-transform:uppercase; font-size:10.5px; letter-spacing:.1em; color:var(--ink-soft); font-weight:700}
  .ai-field input, .ai-field select{padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font-size:14px; font-family:inherit}
  .ai-field input:focus, .ai-field select:focus{outline:none; border-color:var(--brand)}
  .ai-note{font-size:12px; color:var(--ink-soft); line-height:1.55; margin:6px 0 2px}
  .ai-btn{display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-weight:700; font-size:13px; cursor:pointer; margin-top:10px}
  .ai-btn:hover{border-color:var(--brand)}
  .ai-btn.busy{opacity:.6; pointer-events:none}
  .ai-review{margin-top:12px; border:1px solid var(--line); border-radius:12px; background:var(--bg-soft); padding:14px 15px; font-size:13.5px; line-height:1.62; color:var(--ink)}
  .ai-review .ai-head{font-family:var(--mono); text-transform:uppercase; font-size:10.5px; letter-spacing:.1em; color:var(--ink-soft); font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:7px}
  .ai-review .ai-verdict{font-weight:800; margin-bottom:8px}
  .ai-review h4{font-size:12px; font-weight:800; margin:11px 0 3px; color:var(--ink)}
  .ai-review p{margin:0 0 4px}
  .ai-review ul{margin:2px 0 4px; padding-left:18px}
  .ai-review li{margin:2px 0}
  .ai-review code{font-family:var(--mono); background:var(--card); padding:1px 4px; border-radius:4px; font-size:12.5px}
  .ai-spin{width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--brand); border-radius:50%; display:inline-block; animation:aispin .7s linear infinite}
  @keyframes aispin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .ai-spin{animation-duration:1.6s} }

  /* ---------- 아키텍처 설계 (ERD · API · 클라우드) ---------- */
  .arc-wrap{margin-top:10px; border:1px solid var(--line); border-radius:12px; background:var(--bg-soft); overflow:hidden}
  .arc-bar{display:flex; align-items:center; gap:8px; padding:7px 10px; background:var(--card); border-bottom:1px solid var(--line)}
  .arc-bar .t{font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--ink-soft)}
  .arc-stage{padding:12px 10px; min-height:110px; overflow-x:auto}
  .arc-err{color:var(--bad); font-size:12.5px; font-family:var(--mono); white-space:pre-wrap}
  .arc-ent{display:inline-block; vertical-align:top; margin:0 10px 10px 0; min-width:132px;
    border:1px solid var(--line); border-radius:10px; background:var(--card); overflow:hidden}
  .arc-ent > .h{background:var(--brand); color:#fff; font-weight:800; font-size:12.5px; padding:5px 9px}
  .arc-ent .f{display:flex; justify-content:space-between; gap:10px; padding:3px 9px;
    font-family:var(--mono); font-size:11.5px; border-top:1px solid var(--line)}
  .arc-ent .f .ty{color:var(--ink-soft)}
  .arc-ent .f.pk .nm::after{content:" PK"; color:var(--brand); font-weight:800; font-size:9.5px}
  .arc-ent .f.fk .nm::after{content:" FK"; color:var(--dim,#8b5cf6); font-weight:800; font-size:9.5px}
  .arc-ent .f.idx{background:color-mix(in srgb, var(--brand) 8%, transparent)}
  .arc-rel{font-family:var(--mono); font-size:12px; padding:3px 0; color:var(--ink)}
  .arc-rel b{color:var(--brand)}
  .arc-tbl{width:100%; border-collapse:collapse; font-size:12px}
  .arc-tbl th,.arc-tbl td{border:1px solid var(--line); padding:4px 7px; text-align:left; font-family:var(--mono)}
  .arc-tbl th{background:var(--card); font-size:11px; color:var(--ink-soft)}
  .arc-m{display:inline-block; padding:1px 6px; border-radius:5px; font-weight:800; font-size:10.5px; color:#fff}
  .arc-m.GET{background:#1aa38a} .arc-m.POST{background:#3b7dd8} .arc-m.PUT{background:#dd8a1e}
  .arc-m.PATCH{background:#8b5cf6} .arc-m.DELETE{background:#e0533d}
  .arc-node{display:inline-flex; align-items:center; gap:6px; margin:0 8px 8px 0; padding:6px 11px;
    border:1px solid var(--line); border-radius:999px; background:var(--card); font-size:12px; font-weight:700}
  .arc-edge{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); padding:2px 0}
  .arc-sec{font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase;
    letter-spacing:.08em; margin:10px 0 6px}

  /* ---------- 시뮬레이션 (코드 실행 결과를 눈으로 보기) ---------- */
  .sim-wrap{margin-top:10px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--bg-soft)}
  .sim-bar{display:flex; align-items:center; gap:8px; padding:7px 10px; background:var(--card); border-bottom:1px solid var(--line)}
  .sim-bar .sim-step{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); font-weight:700; white-space:nowrap}
  .sim-bar input[type=range]{flex:1; accent-color:var(--brand)}
  .sim-btn{padding:4px 9px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
    color:var(--ink); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit}
  .sim-btn:hover{border-color:var(--brand)}
  .sim-stage{padding:12px 10px; min-height:120px}
  .sim-label{font-size:12px; font-weight:800; color:var(--ink); margin-bottom:8px}
  .sim-row{display:flex; align-items:flex-end; gap:4px; flex-wrap:wrap}
  .sim-cell{min-width:26px; border-radius:6px; background:var(--card); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end; overflow:hidden}
  .sim-cell .v{font-family:var(--mono); font-size:11px; font-weight:700; padding:2px 4px}
  .sim-cell .b{width:100%; background:var(--brand); opacity:.75}
  .sim-cell.hi{border-color:var(--bad); box-shadow:0 0 0 2px color-mix(in srgb, var(--bad) 30%, transparent)}
  .sim-cell.hi .b{background:var(--bad); opacity:.9}
  .sim-cell.dim{opacity:.4}
  .sim-idx{font-family:var(--mono); font-size:9.5px; color:var(--ink-soft); text-align:center; padding-top:2px}
  .sim-kv{display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-family:var(--mono); font-size:12px}
  .sim-kv .k{color:var(--ink-soft)}
  .sim-note{font-size:11.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5}
  .sim-empty{font-size:12.5px; color:var(--ink-soft); padding:14px 4px}

  /* ---------- 막혔을 때 AI 에게 물어보기 (모든 문제 유형) ---------- */
  .ask-open{display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px;
    border:1px dashed var(--line); background:transparent; color:var(--ink-soft); font-weight:700;
    font-size:12.5px; cursor:pointer; margin-top:12px; font-family:inherit}
  .ask-open:hover{border-color:var(--brand); border-style:solid; color:var(--ink)}
  .ask-panel{margin-top:10px; border:1px solid var(--line); border-radius:12px; background:var(--bg-soft); padding:12px}
  .ask-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px}
  .ask-chip{padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:var(--card);
    color:var(--ink); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit}
  .ask-chip:hover{border-color:var(--brand)}
  .ask-chip.busy, .ask-panel.busy .ask-chip, .ask-panel.busy .ask-send{opacity:.5; pointer-events:none}
  .ask-row{display:flex; gap:7px; align-items:flex-end}
  .ask-in{flex:1; min-height:38px; max-height:120px; resize:vertical; padding:9px 11px; border:1px solid var(--line);
    border-radius:10px; background:var(--card); color:var(--ink); font-size:13px; font-family:inherit; line-height:1.5}
  .ask-in:focus{outline:none; border-color:var(--brand)}
  .ask-send{padding:9px 14px; border-radius:10px; border:none; background:var(--ink); color:var(--bg);
    font-weight:800; font-size:13px; cursor:pointer; font-family:inherit; white-space:nowrap}
  .ask-note{font-size:11.5px; color:var(--ink-soft); margin:8px 0 0; line-height:1.5}
  .ask-q{font-size:12px; font-weight:700; color:var(--ink-soft); margin:10px 0 0; font-family:var(--mono)}

  /* ---------- Monaco editor host (VS Code) — falls back to textarea if CDN blocked ---------- */
  .mon-host{height:200px; border:1px solid var(--line); border-radius:0 0 12px 12px; overflow:hidden; background:#1e1e1e}
  .mon-host .monaco-editor, .mon-host .monaco-editor .margin, .mon-host .monaco-editor-background{background-color:transparent}
  @media (max-width:430px){ .mon-host{height:168px} }

  /* ===== Language Intro (PRD §4·5) ===== */
  .intro-banner{display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin:2px 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;cursor:pointer;font:inherit}
  .intro-banner:hover{border-color:var(--brand)}
  .intro-banner .ib-em{font-size:24px;line-height:1}
  .intro-banner .ib-m{flex:1;min-width:0}
  .intro-banner .ib-k{display:block;font-size:11px;opacity:.7;margin-bottom:1px}
  .intro-banner .ib-t{font-weight:800}
  .intro-banner .ib-s{display:block;font-size:12px;opacity:.72;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .intro-banner .ib-go{color:var(--ink-soft);font-weight:800;white-space:nowrap}
  .intro-banner:hover .ib-go{color:var(--brand)}
  .in-hero{display:flex;align-items:center;gap:12px;margin:2px 0 10px}
  .in-hero .ih-em{font-size:38px;line-height:1}
  .in-hero .ih-n{font-size:21px;font-weight:900}
  .in-hero .ih-t{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .in-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
  .in-meta .im{flex:1;min-width:132px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
  .in-meta .im-k{font-size:10.5px;color:var(--ink-soft);letter-spacing:.04em}
  .in-meta .im-v{font-weight:800;font-size:13.5px;margin-top:2px}
  .in-dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:3px}
  .in-dots i.on{background:var(--brand)}
  .in-sec{margin-top:15px}
  .in-sec h4{font-size:12px;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 5px;font-weight:800}
  .in-sec p{margin:0;font-size:14px;line-height:1.65}
  .in-chips{display:flex;flex-wrap:wrap;gap:6px}
  .in-chips span{padding:5px 10px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;background:var(--card)}
  .in-two{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
  .in-two>div{flex:1;min-width:190px;padding:11px 13px;border-radius:12px;border:1px solid var(--line)}
  .in-two .t{font-size:12px;font-weight:800;margin-bottom:5px}
  .in-two ul{margin:0;padding-left:17px;font-size:13px;line-height:1.6}
  .in-pro{background:rgba(26,163,138,.07);border-color:rgba(26,163,138,.32)!important}
  .in-con{background:rgba(224,83,61,.07);border-color:rgba(224,83,61,.32)!important}
  .in-vs{padding:9px 12px;border-left:3px solid var(--brand);background:var(--card);border-radius:0 10px 10px 0;margin-bottom:7px}
  .in-vs b{font-size:13px}
  .in-vs span{display:block;font-size:12.5px;opacity:.82;margin-top:2px;line-height:1.55}
  .in-after{list-style:none;margin:0;padding:0}
  .in-after li{position:relative;padding:6px 0 6px 24px;font-size:13.5px;line-height:1.55;border-bottom:1px solid var(--line)}
  .in-after li:last-child{border-bottom:0}
  .in-after li:before{content:"✓";position:absolute;left:2px;color:var(--brand);font-weight:900}
  .in-cta{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
  /* ===== 난이도 태그 (PRD §10) ===== */
  .lvbadge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.02em;vertical-align:middle;border:1px solid}
  .lvb1{color:#1aa38a;border-color:rgba(26,163,138,.45);background:rgba(26,163,138,.1)}
  .lvb2{color:#3b7dd8;border-color:rgba(59,125,216,.45);background:rgba(59,125,216,.1)}
  .lvb3{color:#c68a12;border-color:rgba(221,138,30,.45);background:rgba(221,138,30,.12)}
  .lvb4{color:#dd6a1e;border-color:rgba(221,106,30,.5);background:rgba(221,106,30,.12)}
  .lvb5{color:#d6336c;border-color:rgba(214,51,108,.45);background:rgba(214,51,108,.1)}
  /* ===== 오늘의 추천 (PRD §22) ===== */
  .reco{margin:12px 0 0}
  .reco-card{padding:13px 15px;border:1px solid rgba(120,140,255,.34);border-radius:14px;background:linear-gradient(135deg,rgba(59,125,216,.11),rgba(91,108,255,.11))}
  .reco-k{font-size:10.5px;letter-spacing:.06em;color:var(--ink-soft);font-weight:800}
  .reco-t{font-size:15.5px;font-weight:900;margin-top:3px;line-height:1.4}
  .reco-w{font-size:12.5px;opacity:.82;margin-top:4px;line-height:1.55}
  .reco-b{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .reco-b button{padding:8px 13px;border:1px solid rgba(120,140,255,.45);border-radius:20px;background:var(--card);color:inherit;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
  .reco-b button:hover{border-color:var(--brand);color:var(--brand)}
  .reco-b button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* ===== 미션 (PRD §37 / §14) ===== */
  .msn{margin-top:11px}
  .msn-h{display:flex;align-items:baseline;justify-content:space-between;font-size:11px;color:var(--ink-soft);font-weight:800;letter-spacing:.04em;margin-bottom:6px}
  .msn-h .msn-wk{font-weight:700;letter-spacing:0}
  .msn-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line)}
  .msn-row .m-em{font-size:16px;line-height:1;width:20px;text-align:center}
  .msn-row .m-t{flex:1;min-width:0;font-size:13px;font-weight:700}
  .msn-row .m-b{display:block;height:4px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
  .msn-row .m-b i{display:block;height:100%;background:var(--brand);border-radius:3px}
  .msn-row .m-n{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap}
  .msn-row.ok .m-t{color:var(--ink-soft);text-decoration:line-through}
  .msn-row.ok .m-n{color:#1aa38a;font-weight:800}
  /* ===== 업적 · 랭크 (PRD §14) ===== */
  .rankbar{display:flex;align-items:center;gap:10px;margin:10px 0 2px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .rankbar .rk-em{font-size:24px;line-height:1}
  .rankbar .rk-m{flex:1;min-width:0}
  .rankbar .rk-n{font-weight:900;font-size:14.5px}
  .rankbar .rk-s{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
  .rankbar .rk-b{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
  .rankbar .rk-b i{display:block;height:100%;background:linear-gradient(90deg,#dd8a1e,#d6336c);border-radius:3px}
  .achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
  .ach{padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:center}
  .ach.got{border-color:rgba(221,138,30,.55);background:rgba(221,138,30,.09)}
  .ach .a-em{font-size:22px;line-height:1;filter:grayscale(1);opacity:.42}
  .ach.got .a-em{filter:none;opacity:1}
  .ach .a-n{font-size:11px;font-weight:800;margin-top:4px;line-height:1.3}
  .ach .a-d{font-size:10px;color:var(--ink-soft);margin-top:2px;line-height:1.35}
  .ach .a-p{font-family:var(--mono);font-size:9.5px;color:var(--ink-soft);margin-top:3px}
  /* ===== 학습 코치 (PRD §19) ===== */
  .cch-big{padding:13px 15px;border-radius:13px;border:1px solid rgba(120,140,255,.34);background:linear-gradient(135deg,rgba(59,125,216,.11),rgba(91,108,255,.11));margin-bottom:14px}
  .cch-big b{font-size:14.5px}
  .cch-big p{margin:5px 0 0;font-size:13px;line-height:1.6;opacity:.88}
  .cch-days{display:flex;align-items:flex-end;gap:3px;height:66px;margin:8px 0 4px}
  .cch-days .cd{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .cch-days .cd i{display:block;background:var(--brand);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
  .cch-days .cd.z i{background:var(--line)}
  .cch-lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-soft)}
  .cch-kpi{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  .cch-kpi .k{flex:1;min-width:96px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
  .cch-kpi .k-k{font-size:10.5px;color:var(--ink-soft)}
  .cch-kpi .k-v{font-weight:900;font-size:17px;font-family:var(--mono);margin-top:1px}
  .cch-tb{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  .cch-tb td{padding:6px 4px;border-top:1px solid var(--line)}
  .cch-tb td:first-child{white-space:nowrap}
  .cch-tb .bar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
  .cch-tb .bar i{display:block;height:100%;border-radius:3px}
  .cch-tb .pc{text-align:right;font-family:var(--mono);white-space:nowrap;color:var(--ink-soft)}
  .cch-tb .na{color:var(--ink-soft);font-size:11.5px}

  /* ===== 로그 분석 (PRD §28) ===== */
  .logwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px;background:#0f1117}
  .logbar{display:flex;align-items:center;gap:6px;padding:7px 11px;background:#171a22;border-bottom:1px solid #232734;font-family:var(--mono);font-size:11px;color:#8b94a8}
  .logbar .dot{width:9px;height:9px;border-radius:50%;background:#3a4152}
  .logbar .hint{margin-left:auto;color:#7f8aa0}
  .logline{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:6px 11px;border:0;border-left:3px solid transparent;background:none;color:#d7dcea;font-family:var(--mono);font-size:12px;line-height:1.5;cursor:pointer}
  .logline+.logline{border-top:1px solid #191d26}
  .logline:hover{background:#161a23}
  .logline .lno{flex:0 0 auto;width:20px;text-align:right;color:#5b6479;user-select:none}
  .logline .revbox{flex:0 0 auto;width:16px;height:16px;border-radius:4px;border:1.5px solid #3a4152;display:grid;place-items:center;font-size:10px;font-weight:900;color:transparent;margin-top:2px}
  .logline .revtxt{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .logline.sel{background:rgba(91,108,255,.16);border-left-color:var(--brand)}
  .logline.sel .revbox{background:var(--brand);border-color:var(--brand);color:#fff}
  .logline.rev-hit{background:rgba(26,163,138,.18);border-left-color:#1aa38a}
  .logline.rev-hit .revbox{background:#1aa38a;border-color:#1aa38a;color:#fff}
  .logline.rev-bad{border-left-color:#1aa38a;background:rgba(26,163,138,.07)}
  .logline.rev-bad .revbox{border-color:#1aa38a;color:#1aa38a}
  .logline.rev-wrong{background:rgba(224,83,61,.16);border-left-color:#e0533d}
  .logline.rev-wrong .revbox{background:#e0533d;border-color:#e0533d;color:#fff}
  .logline .revtag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:9px;font-size:9.5px;font-weight:800;vertical-align:1px}

  /* ===== Git 시뮬레이터 (PRD §25) ===== */
  .gitlab{position:fixed; inset:0; background:var(--bg); z-index:60; display:none; flex-direction:column}
  .gitlab.on{display:flex}
  .gl-top{display:flex; align-items:center; gap:10px; max-width:620px; width:100%; margin:0 auto; padding:14px 14px 8px}
  .gl-top .gl-t{flex:1; min-width:0}
  .gl-top .gl-n{font-weight:900; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .gl-top .gl-p{font-family:var(--mono); font-size:11px; color:var(--ink-soft)}
  .gl-top .gl-list{border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    border-radius:9px; padding:6px 11px; font:inherit; font-size:12px; font-weight:800; cursor:pointer}
  .gl-body{flex:1; overflow-y:auto; width:100%; max-width:620px; margin:0 auto; padding:4px 14px 26px}
  .glm{display:flex; align-items:center; gap:11px; width:100%; text-align:left; margin-bottom:8px; padding:12px 13px;
    border:1px solid var(--line); border-radius:13px; background:var(--card); color:inherit; font:inherit; cursor:pointer}
  .glm:hover{border-color:var(--brand)}
  .glm.done{border-color:rgba(26,163,138,.5); background:rgba(26,163,138,.07)}
  .glm .gm-em{font-size:22px; line-height:1}
  .glm .gm-m{flex:1; min-width:0}
  .glm .gm-t{font-weight:800; font-size:14px}
  .glm .gm-s{font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.45}
  .glm .gm-go{font-weight:900; color:var(--ink-soft); white-space:nowrap}
  .gl-brief{padding:13px 15px; border-radius:13px; border:1px solid rgba(120,140,255,.34);
    background:linear-gradient(135deg,rgba(59,125,216,.11),rgba(91,108,255,.11)); margin-bottom:10px}
  .gl-brief p{margin:6px 0 0; font-size:13.5px; line-height:1.65}
  .gl-goal{margin-top:9px; padding:9px 11px; border-radius:10px; background:var(--card); border:1px solid var(--line);
    font-size:12.5px; line-height:1.55}
  .gl-goal b{color:var(--brand)}
  .gl-goal.met{border-color:var(--good); background:var(--good-soft)}
  .gl-teach{margin-top:8px}
  .gl-teach summary{cursor:pointer; font-size:12.5px; font-weight:800; color:var(--ink-soft)}
  .gl-teach p{margin:7px 0 0; font-size:13px; line-height:1.7}
  .gl-h{font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--ink-soft); margin:14px 0 6px}
  .gl-panel{border:1px solid var(--line); border-radius:12px; background:var(--card); padding:11px 13px}
  .gl-refs{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:9px}
  .gl-refs span{font-family:var(--mono); font-size:11px; font-weight:800; padding:2px 8px; border-radius:20px;
    border:1px solid var(--line); color:var(--ink-soft)}
  .gl-refs span.head{border-color:var(--brand); color:var(--brand)}
  .gl-refs span.rem{border-style:dashed}
  .gl-graph{font-family:var(--mono); font-size:11.5px; line-height:1.75}
  .gl-graph .gc{display:flex; gap:7px}
  .gl-graph .gd{color:var(--brand)}
  .gl-graph .gid{color:var(--ink-soft)}
  .gl-graph .gr{color:var(--good); font-weight:800}
  .gl-files{display:flex; flex-wrap:wrap; gap:6px}
  .gl-files button{font-family:var(--mono); font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:9px;
    border:1px solid var(--line); background:var(--bg-soft); color:var(--ink); cursor:pointer}
  .gl-files button.sel{border-color:var(--brand); color:var(--brand)}
  .gl-files button.dirty:after{content:" ●"; color:#dd8a1e}
  .gl-files button.nw{border-style:dashed; color:var(--ink-soft)}
  .gl-ed{margin-top:9px}
  .gl-ed textarea{width:100%; min-height:120px; font-family:var(--mono); font-size:12.5px; line-height:1.6;
    padding:10px; border-radius:10px; border:1px solid var(--line); background:#0f1117; color:#e6e9f2; resize:vertical}
  .gl-ed .row{display:flex; gap:7px; margin-top:7px}
  .gl-ed .row button{flex:0 0 auto; padding:8px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:inherit; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer}
  .gl-ed .row button.pri{background:var(--brand); color:#fff; border-color:var(--brand)}
  .gl-term{background:#0f1117; border:1px solid #22252f; border-radius:12px; overflow:hidden}
  .gl-out{max-height:210px; overflow-y:auto; padding:10px 12px; font-family:var(--mono); font-size:12px; line-height:1.65; color:#d7dcea}
  .gl-out .cin{color:#8fa6ff}
  .gl-out .cerr{color:#ff9d8a}
  .gl-out div{white-space:pre-wrap; overflow-wrap:anywhere}

let __toastT=null;
function toast(msg){ const t=$("toast"); if(!t){ return; } t.textContent=msg; t.classList.add("on");
  clearTimeout(__toastT); __toastT=setTimeout(()=>t.classList.remove("on"), 2800); }
function confirmModal(msg, onYes, opts){ opts=opts||{};
  const o=$("confirm"), m=$("confirm-msg"), yes=$("confirm-yes"), no=$("confirm-no");
  m.textContent=msg;
  yes.textContent=opts.yes||"확인"; no.textContent=opts.no||"취소";
  yes.className="confirm-yes"+(opts.danger?" danger":"");
  const close=()=>{ o.classList.remove("on"); document.body.style.overflow=""; yes.onclick=null; no.onclick=null; };
  yes.onclick=()=>{ close(); onYes&&onYes(); };
  no.onclick=close;
  o.onclick=e=>{ if(e.target===o) close(); };
  o.classList.add("on"); document.body.style.overflow="hidden";
}

function aiCfg(){ if(!S.ai)S.ai={provider:"proxy",model:"gemini-2.0-flash",key:""};
  // 키를 안 넣은 상태면 자동으로 서버(Vercel 환경변수) 사용 — 환경변수만 넣으면 충분
  if(S.ai.provider!=="proxy" && !(S.ai.key&&String(S.ai.key).trim())){ S.ai.provider="proxy"; if(!/^gemini/.test(S.ai.model||"")) S.ai.model="gemini-2.0-flash"; }
  return S.ai; }
function aiReady(){ const c=aiCfg(); const p=AI_PROVIDERS[c.provider]; if(p&&p.noKey) return !!(c.provider&&c.model); return !!(c.key&&c.provider&&c.model); }
function aiCall(system, user, maxTokens){
  const c=aiCfg(); maxTokens=maxTokens||1400;
  if(c.provider==="proxy"){
    return fetch("/api/review",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({system:system,user:user,model:c.model,maxTokens:maxTokens})})
      .then(r=>r.json().catch(()=>{throw new Error("서버 응답을 읽지 못했어요 (프록시 미배포?)");}))
      .then(j=>{ if(j.error) throw new Error(j.error); return (j.text||"").trim(); });
  }
  if(c.provider==="anthropic"){
    return fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
      "content-type":"application/json","x-api-key":c.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:c.model,max_tokens:maxTokens,system:system,messages:[{role:"user",content:user}]})})
      .then(r=>r.json()).then(j=>{ if(j.error) throw new Error(j.error.message||"API 오류"); return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim(); });
  }
  if(c.provider==="openai"){
    return fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{
      "content-type":"application/json","authorization":"Bearer "+c.key},
      body:JSON.stringify({model:c.model,max_tokens:maxTokens,messages:[{role:"system",content:system},{role:"user",content:user}]})})
      .then(r=>r.json()).then(j=>{ if(j.error) throw new Error(j.error.message||"API 오류"); return (j.choices&&j.choices[0]&&j.choices[0].message.content||"").trim(); });
  }
  // gemini
  return fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(c.model)+":generateContent?key="+encodeURIComponent(c.key),{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:"user",parts:[{text:user}]}],generationConfig:{maxOutputTokens:maxTokens}})})
    .then(r=>r.json()).then(j=>{ if(j.error) throw new Error(j.error.message||"API 오류"); const c=j.candidates&&j.candidates[0]; return (c&&c.content&&c.content.parts||[]).map(p=>p.text||"").join("").trim(); });
}
function aiMd(s){ // minimal markdown → html, input pre-escaped
  s=escHtml(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  const lines=s.split(/\n/); let out="",inList=false;
  for(let ln of lines){ ln=ln.replace(/\s+$/,"");
    let m=ln.match(/^\s*[-*]\s+(.*)$/);
    if(m){ if(!inList){out+="<ul>";inList=true;} out+="<li>"+m[1]+"</li>"; continue; }
    if(inList){out+="</ul>";inList=false;}
    let h=ln.match(/^\s*#{1,4}\s+(.*)$/);
    if(h){ out+="<h4>"+h[1]+"</h4>"; continue; }
    if(ln.trim()==="") continue;
    out+="<p>"+ln+"</p>";
  }
  if(inList)out+="</ul>";
  return out;
}

/* ---- V5: 막혔을 때 물어보기 — 모든 문제 유형에서, 풀기 전에도 ----
   기존 AI 리뷰는 코드·SQL 문제를 푼 *뒤*에만 열렸다. 막힌 순간에 물어볼 데가 없으면
   결국 답을 보고 넘기게 된다. 그래서 어떤 유형이든 문제 화면에서 바로 물어볼 수 있게 한다.
   단, 풀기 전에는 정답을 말하지 못하게 시스템 프롬프트로 잠근다 — 힌트는 학습이고 정답은 아니다. */
function qPlain(s){   // 문항 필드에는 HTML(escape 된 코드 포함)이 섞여 있다. AI 에게는 평문으로 보낸다.
  return String(s==null?"":s)
    .replace(/<br\s*\/?>/gi,"\n").replace(/<\/(p|div|pre|li|tr)>/gi,"\n").replace(/<[^>]+>/g,"")
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&")
    .replace(/\n{3,}/g,"\n\n").trim();
}
function askEditorVal(q){
  const ta=$(q.t==="sql"?"sqlcode":q.t==="py"?"pycode":"livecode");
  return ta? String(ta.value||"") : "";   // Monaco 는 편집 내용을 textarea 로 되돌려 준다
}
function qAsText(q){
  let s="[문제]\n"+qPlain(q.q);
  if(q.code) s+="\n\n[주어진 코드]\n"+qPlain(q.code);
  if(Array.isArray(q.o)) s+="\n\n[보기]\n"+q.o.map((o,i)=>String.fromCharCode(65+i)+". "+qPlain(o)).join("\n");
  if(Array.isArray(q.items)){
    const isLog=q.t==="log";
    s+="\n\n["+(isLog?"로그":"검토 항목")+"]\n"+q.items.map((it,i)=>(i+1)+". "+qPlain(it.txt)).join("\n");
    s+="\n\n(이 문제는 "+(isLog?"가장 먼저 고쳐야 하는 원인 한 줄을 고르는":"실제 결함인 항목을 모두 고르는")+" 문제다)";
  }
  if(q.t==="input") s+="\n\n(짧은 단답을 직접 입력하는 문제다)";
  if(q.t==="code"||q.t==="py"||q.t==="sql"||q.t==="html"||q.t==="react"||q.t==="ts"||q.t==="sim"||q.t==="arch"){
    const lang=q.t==="sql"?"SQL":q.t==="py"?"Python":q.t==="html"?"HTML/CSS":q.t==="react"?"React (JSX)":q.t==="ts"?"TypeScript":"JavaScript";
    s+="\n\n(직접 "+lang+" 코드를 작성해 테스트를 통과시키는 문제다)";
    if(q.schema) s+="\n\n[테이블 스키마]\n"+qPlain(q.schema);
    if(Array.isArray(q.tests)&&q.tests.length)
      s+="\n\n[통과해야 하는 테스트]\n"+q.tests.map(t=>qPlain(t.in)+" → "+qPlain(t.out)).join("\n");
    const cur=askEditorVal(q);
    if(cur.trim()) s+="\n\n[내가 지금 쓴 코드]\n"+cur;
  }
  return s;
}
function qAnswerText(q){
  if(Array.isArray(q.items)){
    const idx=[]; q.items.forEach((it,i)=>{ if(it.bad) idx.push(i+1); });
    return idx.join(", ")+"번 — "+idx.map(n=>qPlain(q.items[n-1].txt)).join(" / ");
  }
  if(q.t==="input") return (q.a||[]).map(qPlain).join(" 또는 ");
  if(Array.isArray(q.o)&&typeof q.a==="number") return String.fromCharCode(65+q.a)+". "+qPlain(q.o[q.a]);
  if(q.sol) return q.sol;   // 실행형 참조 해답 (code 유형은 없을 수 있다 — 테스트가 명세다)
  return "";
}
function myAnswerText(q){
  if(Array.isArray(q.items)&&run.revsel) return [...run.revsel].map(i=>i+1).sort((a,b)=>a-b).join(", ")+"번";
  if(q.t==="input"){ const f=$("fill"); return f? String(f.value||"") : ""; }
  if(q.t==="code"||q.t==="py"||q.t==="sql"||q.t==="html"||q.t==="react"||q.t==="ts"||q.t==="sim"||q.t==="arch") return askEditorVal(q);
  if(Array.isArray(q.o)&&run.picked!=null) return String.fromCharCode(65+run.picked)+". "+qPlain(q.o[run.picked]);
  return "";
}

/* ===== 지연 로딩 =====
   콘텐츠 전체를 한 파일에 담으면 첫 화면까지 9MB 를 받아야 한다. 셸에는 구조(트랙·유닛·레슨 제목)만
   두고 문항·이론·시뮬·프로젝트는 필요한 시점에 가져온다. fetch 가 아니라 <script> 주입을 쓰는 이유는
   file:// 로 열었을 때도 동작해야 하기 때문이다 (fetch 는 CORS 로 막힌다). */
const __chunk={};              // 파일명 -> Promise
const __got={};                // 받은 청크 키
function loadChunk(file){
  if(__chunk[file]) return __chunk[file];
  __chunk[file]=new Promise(function(res,rej){
    const s=document.createElement("script");
    s.src="data/"+file; s.async=true;
    s.onload=function(){ res(true); };
    s.onerror=function(){ delete __chunk[file]; rej(new Error(file)); };
    document.head.appendChild(s);
  });
  return __chunk[file];
}
/* 데이터 파일이 호출하는 등록 함수 */
function __CR(key, val){
  __got[key]=true;
  if(key.indexOf("t:")===0){ mergeTrack(key.slice(2), val); return; }
  if(key==="sims"){ SIMS=val; return; }
  if(key==="diags"){ DIAGS=val; return; }
  if(key==="projects"){ PROJECTS=val; return; }
  if(key==="build"){ BUILD_PROJECTS=val.projects; BUILD_SOL=val.sol; return; }
  if(key==="lib:react"){ window.__reactSrc=val; return; }
}
/* 트랙 문항을 제목으로 맞춰 구조에 얹는다 — 유닛 순서는 reorderUnits() 로 이미 바뀌어 있다 */
function mergeTrack(k, units){
  const c=COURSES[k]; if(!c) return;
  /* 제목이 같은 유닛이 둘 이상 있는 트랙이 있다(backend 의 "인증·인가" 등). 후보를 모아 두고
     레슨 제목이 가장 많이 겹치는 쪽을 고른 뒤, 쓴 원본은 빼서 두 번 쓰이지 않게 한다. */
  const pool={};
  units.forEach(function(u){ (pool[u.t]=pool[u.t]||[]).push(u); });
  c.units.forEach(function(cu){
    const cands=pool[cu.title];
    if(!cands||!cands.length) return;
    let src=cands[0];
    if(cands.length>1){
      const want={};
      cu.lessons.forEach(function(l){ want[l.title]=1; });
      let best=-1;
      cands.forEach(function(u){
        let hit=0; u.l.forEach(function(l){ if(want[l.t]) hit++; });
        if(hit>best){ best=hit; src=u; }
      });
    }
    cands.splice(cands.indexOf(src),1);
    /* 레슨도 제목이 겹칠 수 있다. 유닛 안에서 레슨 순서는 바뀌지 않으므로 앞에서부터 하나씩 꺼내 쓴다 */
    const lby={};
    src.l.forEach(function(l){ (lby[l.t]=lby[l.t]||[]).push(l); });
    cu.lessons.forEach(function(cl){
      const q=lby[cl.title];
      const sl=q&&q.length? q.shift() : null;
      if(!sl) return;
      cl.q=sl.q||[];
      if(sl.th) cl.theory=sl.th;
    });
  });
  /* 어떤 이유로든 짝을 못 찾은 레슨이 있어도 앱이 죽지는 않게 한다 */
  c.units.forEach(function(u){ u.lessons.forEach(function(l){ if(!Array.isArray(l.q)) l.q=[]; }); });
  c._loaded=true;
  applyAnswerFixesFor(k);
}
function trackLoaded(k){ return !!(COURSES[k]&&COURSES[k]._loaded); }
function ensureTrack(k){
  if(!COURSES[k]) return Promise.reject(new Error("unknown track "+k));
  if(trackLoaded(k)) return Promise.resolve(true);
  return loadChunk("t-"+k+".js");
}
function ensureSims(){ return __got.sims?Promise.resolve(true):loadChunk("sims.js"); }
function ensureDiags(){ return __got.diags?Promise.resolve(true):loadChunk("diags.js"); }
function ensureProjects(){ return __got.projects?Promise.resolve(true):loadChunk("projects.js"); }

/* TypeScript·JSX 변환기 (sucrase, 288KB). 파서만 필요하므로 부모 문서에서 돌린다. */
function ensureSucrase(){
  if(typeof Sucrase!=="undefined" && Sucrase.transform) return Promise.resolve(true);
  return loadChunk("sucrase.js");
}
/* React 라이브러리 "원문". iframe 은 sandbox 라 상대 경로 스크립트를 못 불러오므로
   소스를 문자열로 받아 srcdoc 안에 직접 심는다. */
function ensureReactSrc(){
  if(window.__reactSrc) return Promise.resolve(window.__reactSrc);
  return loadChunk("react-src.js").then(function(){ return window.__reactSrc; });
}
function tsToJs(src, jsx){
  var tr=jsx?["typescript","jsx"]:["typescript"];
  try{ return {code:Sucrase.transform(src,{transforms:tr, jsxRuntime:"classic", production:true}).code}; }
  catch(e){ return {error:String(e&&e.message||e).replace(/^.*?:\s*/,"")}; }
}

/* 내가 손댄 트랙 — 진도 키가 "트랙:해시" 라서 여기서 뽑아낼 수 있다 */
function touchedTracks(){
  const seen={}, out=[];
  Object.keys(S.done||{}).forEach(function(k){
    const t=k.split(":")[0];
    if(t&&COURSES[t]&&!seen[t]){ seen[t]=1; out.push(t); }
  });
  if(!seen[curLang]&&COURSES[curLang]) out.unshift(curLang);
  return out;
}
/* 서비스 워커에게 "이 파일들 받아 둬" 라고 알린다. 실행은 하지 않으므로 메모리를 쓰지 않고,
   비행기 모드에서도 내가 쓰던 트랙은 열린다. */
function swPrecache(files){
  if(!("serviceWorker" in navigator) || location.protocol==="file:") return;
  navigator.serviceWorker.ready.then(function(reg){
    if(reg.active) reg.active.postMessage({type:"precache", urls:files.map(function(f){ return "data/"+f; })});
  }).catch(function(){});
}

/* 첫 화면을 그린 뒤, 한가할 때 나머지를 미리 받아 둔다 */

    /* 실행까지 할 필요는 없는 것들은 캐시에만 채워 둔다 */
    const files=touchedTracks().slice(0,8).map(function(t){ return "t-"+t+".js"; });
    if(curLang==="sql"||S.done&&Object.keys(S.done).some(function(k){ return k.indexOf("sql:")===0; })){
      files.push("sql-wasm.js","sql-lib.js");
    }
    if(files.length) swPrecache(files);
  });
}

const BL_HELP =

function buildDoc(files, tests, day){
  day=day||{};
  return '<!doctype html><meta charset=utf-8><body><scr'+'ipt>'
   +'var __src='+JSON.stringify(files)+', __mods={};'
   +'function require(n){ var k=String(n).replace(/^\\.\\//,""); if(!/\\.js$/.test(k)) k+=".js";'
   +' if(__mods[k]) return __mods[k].exports;'
   +' if(__src[k]===undefined) throw new Error("파일을 찾을 수 없습니다: "+k);'
   +' var m={exports:{}}; __mods[k]=m;'
   +' (new Function("module","exports","require",__src[k]))(m,m.exports,require); return m.exports; }'
   +'function __reset(){ __mods={}; }'
   +'var DOCF='+JSON.stringify(day.doc||"")+', REFSRC='+JSON.stringify(day.ref||"")+';'
   /* 설계 Day: JSON 파일을 D 로 넘긴다. 코드가 아니라 문서를 검사하므로 실행하지 않고 파싱만 한다. */
   +'function __json(f){ var t=__src[f]; if(t===undefined) throw new Error("파일이 없습니다: "+f);'
   +' try{ return JSON.parse(t); }catch(e){ throw new Error(f+" 의 JSON 형식이 올바르지 않습니다 — "+e.message); } }'
   /* app.js 가 깨져도 문서 검사는 계속돼야 한다. 실제로 A 를 만질 때만 터지게 미룬다. */
   +'function __softA(){ try{ return require("./app"); }catch(e){ var m=String(e&&e.message||e);'
   +'  return new Proxy({}, {get:function(){ throw new Error("app.js 를 불러오지 못했습니다 — "+m); }}); } }'
   /* 변이 테스트: 기준 구현의 한 부분만 바꾼 앱을 만든다. 사용자 테스트가 이걸 잡아야 한다. */
   +'function __build(src){ var keep=__src["app.js"]; __src["app.js"]=src; __mods={};'
   +'  try{ return require("./app"); } finally { __src["app.js"]=keep; __mods={}; } }'
   +'function REF(){ return __build(REFSRC); }'
   +'function MUT(from,to){ if(REFSRC.indexOf(from)<0) throw new Error("내부 오류: 변이 지점을 찾지 못했습니다");'
   +'  return __build(REFSRC.split(from).join(to)); }'
   +'var TS='+JSON.stringify(tests)+', HELP='+JSON.stringify(BL_HELP)+', out=[];'
   +'for(var i=0;i<TS.length;i++){ try{ __reset();'
   +'  (new Function((DOCF||REFSRC?"var A=__softA(), D=DOCF?__json(DOCF):null;":"var A=require(\'./app\');")+HELP+"\\n"+TS[i].c))();'
   +'  out.push({n:TS[i].n, ok:true});'
   +'}catch(e){ out.push({n:TS[i].n, ok:false, err:String(e&&e.message||e)}); } }'
   +'parent.postMessage({__cr:"build", res:out}, "*");'
   +'</scr'+'ipt></body>';
}

function blOpen(pi){

function blApplyDayFiles(){

      if(!st.files[f] || st.files[f]===((p.seed||{})[f])){ st.files[f]=d.addFiles[f]; changed=true; }
    });

function blSaveCurrent(){
