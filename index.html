/* 무한 루프가 든 코드는 srcdoc 을 비워도 멈추지 않는다 — 이미 도는 스크립트는 중단되지 않는다.
   iframe 자체를 떼어내고 새로 달아야 그 브라우징 컨텍스트가 통째로 사라진다. */
function blFreshFrame(){
  const fr=$("bl-frame"); if(!fr) return null;
  const nf=fr.cloneNode(false); nf.removeAttribute("srcdoc");
  fr.parentNode.replaceChild(nf, fr);
  return nf;
}
function blRun(){
  blSaveCurrent();
  const p=blProject(), st=blState(p.id), d=p.days[BL.di];
  BL.running=true; BL.res=null; blRender();
  const fr=$("bl-frame"); if(!fr){ BL.running=false; return; }
  clearTimeout(__blTimer);
  __blTimer=setTimeout(()=>{
    if(!BL||!BL.running) return;
    blFreshFrame();
    BL.running=false;
    BL.res=d.tests.map(t=>({n:t.n, ok:false, err:"실행이 끝나지 않았습니다 — 무한 루프가 있는지 확인하세요."}));
    blRender();
  }, 5000);
  fr.srcdoc=buildDoc(st.files, d.tests, d);
}
function blOnResult(res){
  if(!BL||!BL.running) return;
  clearTimeout(__blTimer);
  BL.running=false; BL.res=res;
  const p=blProject(), st=blState(p.id), d=p.days[BL.di];
  const allOk=res.length && res.every(x=>x.ok);
  if(allOk && st.done.indexOf(d.n)<0){
    st.done.push(d.n); st.done.sort((a,b)=>a-b);
    S.xp+=60; save();
    if(typeof awardSkill==="function"){ awardSkill("coding",6); awardSkill("system_design",4); save(); }
    if(typeof toast==="function") toast("Day "+d.n+" 통과 · +60 XP 🎉");
    if(typeof checkAchv==="function") checkAchv(true);
    if(typeof paintStats==="function") paintStats();
  }
  blRender();
}

/* ===== Git 시뮬레이터 엔진 (PRD §25) ===== */
/* ===== Git 시뮬레이터 엔진 (PRD §25) — DOM 비의존 ===== */
function gitNew(){ return {c:{}, b:{}, H:null, idx:{}, wd:{}, tags:{}, rb:{}, stash:[], seq:0, ms:null, rs:null, out:[]}; }
function gSha(g){ /* 실제 git 처럼 흩어진 7자리 16진수 — 짧은 해시로 지목할 수 있어야 한다 */
  for(let i=0;i<64;i++){ g.seq++;
    const x=(((g.seq*2654435761)>>>0)^0x9e3779b9)>>>0;
    const id=("0000000"+x.toString(16)).slice(-7);
    if(!g.c[id]) return id; }
  return "x"+g.seq.toString(16); }
function gClone(o){ return JSON.parse(JSON.stringify(o)); }
function gHeadId(g){ if(!g.H) return null; return g.H.t==="b" ? (g.b[g.H.n]||null) : g.H.id; }
function gTree(g,id){ return id&&g.c[id] ? gClone(g.c[id].tree) : {}; }
function gHeadTree(g){ return gTree(g, gHeadId(g)); }
function gCommit(g, msg, parents, tree){
  const id=gSha(g);
  g.c[id]={id, msg, par:parents.filter(Boolean), tree:gClone(tree), t:g.seq};
  return id;
}
function gAdvance(g,id){ if(g.H.t==="b") g.b[g.H.n]=id; else g.H.id=id; }
function gAncestors(g,id,set){ set=set||new Set(); if(!id||set.has(id))return set; set.add(id);
  (g.c[id]?g.c[id].par:[]).forEach(p=>gAncestors(g,p,set)); return set; }
function gIsAnc(g,a,b){ return a===b || gAncestors(g,b).has(a); }   // a가 b의 조상인가
function gBase(g,a,b){ const A=gAncestors(g,a); let best=null;
  const B=[...gAncestors(g,b)].filter(x=>A.has(x));
  B.forEach(x=>{ if(!best||g.c[x].t>g.c[best].t) best=x; });
  return best; }
function gResolve(g,ref){
  if(!ref) return null;
  let m=ref.match(/^(.+?)([~^])(\d*)$/);
  if(m){ let id=gResolve(g,m[1]); let n=m[2]==="^"?(m[3]?+m[3]:1):(m[3]?+m[3]:1);
    if(m[2]==="^"){ const c=g.c[id]; return c?(c.par[n-1]||null):null; }
    for(let i=0;i<n&&id;i++){ const c=g.c[id]; id=c?(c.par[0]||null):null; }
    return id; }
  if(ref==="HEAD") return gHeadId(g);
  if(g.b[ref]!=null) return g.b[ref];
  if(g.rb[ref]!=null) return g.rb[ref];
  if(g.tags[ref]!=null) return g.tags[ref];
  if(g.c[ref]) return ref;
  const hit=Object.keys(g.c).filter(id=>id.indexOf(ref)===0);
  return hit.length===1?hit[0]:null;
}
function gFiles(t){ return Object.keys(t).sort(); }
function gSameTree(a,b){ const ka=gFiles(a),kb=gFiles(b);
  if(ka.length!==kb.length) return false;
  return ka.every((k,i)=>k===kb[i] && a[k]===b[k]); }
function gStatus(g){
  const H=gHeadTree(g), st=[], un=[], nt=[];
  const all=new Set([...gFiles(H),...gFiles(g.idx),...gFiles(g.wd)]);
  [...all].sort().forEach(f=>{
    const h=H[f], i=g.idx[f], w=g.wd[f];
    if(i!==h) st.push((h==null?"new:    ":i==null?"deleted:":"modified:")+" "+f);
    if(w!==i){ if(i==null&&h==null) nt.push(f); else un.push((w==null?"deleted: ":"modified:")+" "+f); }
  });
  return {staged:st, unstaged:un, untracked:nt, clean:!st.length&&!un.length&&!nt.length};
}
/* 3-way 파일 병합: 같으면 통합, 한쪽만 바뀌면 그쪽, 양쪽 다르면 충돌 */
function gMergeTrees(g, base, ours, theirs, ourLbl, thLbl){
  const out={}, conf=[];
  const all=new Set([...gFiles(base),...gFiles(ours),...gFiles(theirs)]);
  [...all].sort().forEach(f=>{
    const b=base[f], o=ours[f], t=theirs[f];
    if(o===t){ if(o!=null) out[f]=o; return; }
    if(o===b){ if(t!=null) out[f]=t; return; }          // 우리는 그대로 → 상대 적용
    if(t===b){ if(o!=null) out[f]=o; return; }          // 상대가 그대로 → 우리 유지
    conf.push(f);
    out[f]="<<<<<<< "+ourLbl+"\n"+(o==null?"":o)+"\n=======\n"+(t==null?"":t)+"\n>>>>>>> "+thLbl;
  });
  return {tree:out, conf};
}
function gParse(line){
  const out=[]; let cur="", q=null;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch===q){q=null;} else cur+=ch; continue; }
    if(ch==='"'||ch==="'"){ q=ch; continue; }
    if(/\s/.test(ch)){ if(cur){out.push(cur);cur="";} continue; }
    cur+=ch; }
  if(cur) out.push(cur);
  return out;
}
function gShort(g,id){ return id?(id+" "+(g.c[id]?g.c[id].msg:"?")):"(none)"; }
function gLogList(g,id){ const seen=new Set(), out=[]; const st=id?[id]:[];
  while(st.length){ const x=st.pop(); if(!x||seen.has(x))continue; seen.add(x); out.push(g.c[x]);
    (g.c[x].par||[]).forEach(p=>st.push(p)); }
  return out.sort((a,b)=>b.t-a.t); }

/* ---- 명령 실행: {ok, out:[lines], err} ---- */
function gitRun(g, line){

  const E=s=>({ok:false, out:Array.isArray(s)?s:[s], err:true});
  if(a[0]==="help") return L(["사용 가능: status, add, commit -m, log, branch, checkout/switch, merge, rebase, reset, revert, cherry-pick, stash, push, fetch, pull, tag, diff, restore",
                             "파일 편집은 오른쪽 편집기를 쓰세요."]);
  if(a[0]!=="git") return E(a[0]+": 이 시뮬레이터는 git 명령만 실행합니다. (help)");
  const cmd=a[1], r=a.slice(2);
  const flag=f=>r.indexOf(f)>=0;
  const pos=r.filter(x=>x[0]!=="-");

  if(cmd==="status"){
    const s=gStatus(g), o=[];
    o.push("On branch "+(g.H.t==="b"?g.H.n:"(detached HEAD "+g.H.id+")"));
    if(g.ms) o.push("You have unmerged paths. (충돌 해결 후 git add, git commit)");
    if(g.rs) o.push("rebase in progress — 해결 후 git add, git rebase --continue");
    if(s.staged.length){ o.push("Changes to be committed:"); s.staged.forEach(x=>o.push("  "+x)); }
    if(s.unstaged.length){ o.push("Changes not staged for commit:"); s.unstaged.forEach(x=>o.push("  "+x)); }
    if(s.untracked.length){ o.push("Untracked files:"); s.untracked.forEach(x=>o.push("  "+x)); }
    if(s.clean) o.push("nothing to commit, working tree clean");
    return L(o);
  }
  if(cmd==="add"){
    if(!pos.length) return E("Nothing specified. (git add <file> 또는 git add .)");
    const files = pos.indexOf(".")>=0 || pos.indexOf("-A")>=0
      ? [...new Set([...gFiles(g.wd), ...gFiles(g.idx), ...gFiles(gHeadTree(g))])]
      : pos;
    let n=0;
    files.forEach(f=>{
      if(g.wd[f]==null){ if(g.idx[f]!=null||gHeadTree(g)[f]!=null){ delete g.idx[f]; n++; } }
      else { if(g.idx[f]!==g.wd[f]) n++; g.idx[f]=g.wd[f]; }
    });
    if(g.ms) g.ms.conf=g.ms.conf.filter(f=>files.indexOf(f)<0);
    if(g.rs) g.rs.conf=(g.rs.conf||[]).filter(f=>files.indexOf(f)<0);
    return L(n?("staged "+n+" file(s)"):"변경 없음 (이미 스테이지됨)");

    const mi=r.indexOf("-m");
    const msg = mi>=0 ? r[mi+1] : null;
    if(!msg) return E('커밋 메시지가 필요합니다: git commit -m "메시지"');
    if(g.ms && g.ms.conf.length) return E("아직 해결되지 않은 충돌이 있습니다: "+g.ms.conf.join(", "));
    const H=gHeadTree(g);
    if(!g.ms && gSameTree(H,g.idx)) return E("nothing to commit — 먼저 git add 로 스테이지하세요.");
    const par = g.ms ? [gHeadId(g), g.ms.other] : [gHeadId(g)];
    const id=gCommit(g,msg,par,g.idx);
    gAdvance(g,id);
    g.wd=gClone(g.idx);
    const merged=!!g.ms; g.ms=null;
    return L("["+(g.H.t==="b"?g.H.n:"detached")+" "+id+"] "+msg+(merged?"  (merge commit)":""));
  }

    const list=gLogList(g,gHeadId(g));
    if(!list.length) return L("아직 커밋이 없습니다.");
    return L(list.map(c=>c.id+" "+c.msg+(c.par.length>1?"  (merge)":"")+gRefsAt(g,c.id)));
  }
  if(cmd==="branch"){
    if(flag("-d")||flag("-D")){ const n=pos[0]; if(!g.b[n]) return E("branch '"+n+"' not found");
      if(g.H.t==="b"&&g.H.n===n) return E("현재 체크아웃된 브랜치는 삭제할 수 없습니다.");
      delete g.b[n]; return L("Deleted branch "+n); }
    if(!pos.length) return L(Object.keys(g.b).sort().map(n=>(g.H.t==="b"&&g.H.n===n?"* ":"  ")+n+" "+g.b[n]));
    if(g.b[pos[0]]) return E("branch '"+pos[0]+"' already exists");
    const at=pos[1]?gResolve(g,pos[1]):gHeadId(g);

    if(flag("--")||(cmd==="restore")){ }
    if(flag("-b")||flag("-c")){

      if(g.b[n]) return E("branch '"+n+"' already exists");

function gRebaseStep(g){
  const out=[];
  while(g.rs && g.rs.todo.length){
    const id=g.rs.todo.shift(), c=g.c[id];
    const par=gTree(g,c.par[0]);
    const m=gMergeTrees(g, par, gHeadTree(g), c.tree, "HEAD", c.msg);
    if(m.conf.length){ g.rs.cur=c; g.rs.conf=m.conf.slice(); g.wd=gClone(m.tree); g.idx=gClone(gHeadTree(g));
      out.push("CONFLICT: "+m.conf.join(", ")+" — 해결 후 git add, git rebase --continue");
      return {ok:false, out, err:true}; }
    const nid=gCommit(g,c.msg,[gHeadId(g)],m.tree); gAdvance(g,nid);
    g.idx=gClone(m.tree); g.wd=gClone(m.tree);
    out.push("applied "+c.msg+" → "+nid);
  }
  if(g.rs){ const b=g.rs.branch; g.rs=null; out.push("Successfully rebased "+b+"."); }
  return {ok:true, out};
}
function gRefsAt(g,id){
  const rs=[];
  Object.keys(g.b).forEach(n=>{ if(g.b[n]===id) rs.push(n); });
  Object.keys(g.rb).forEach(n=>{ if(g.rb[n]===id) rs.push(n); });
  Object.keys(g.tags).forEach(n=>{ if(g.tags[n]===id) rs.push("tag:"+n); });
  if(gHeadId(g)===id) rs.unshift("HEAD");
  return rs.length?("  ("+rs.join(", ")+")"):"";
}
/* 초기 저장소 만들기 — spec: {commits:[{m,f}], branches:{name:"HEAD~n"|idx}, checkout, wd:{}, remote:{}} */
function gInit(spec){
  spec=spec||{};
  const g=gitNew();
  g.b={main:null}; g.H={t:"b",n:"main"};
  let tree={}, ids=[];
  (spec.commits||[]).forEach(cm=>{
    Object.keys(cm.f||{}).forEach(f=>{ if(cm.f[f]==null) delete tree[f]; else tree[f]=cm.f[f]; });
    const id=gCommit(g,cm.m,[gHeadId(g)],tree); g.b.main=id; ids.push(id);
  });
  /* 추가 브랜치: {name:{at:커밋인덱스, commits:[{m,f}]}} */
  Object.keys(spec.branches||{}).forEach(n=>{
    const spc=spec.branches[n];
    const at=ids[spc.at==null?ids.length-1:spc.at];
    g.b[n]=at; const save=g.H; g.H={t:"b",n};
    let t2=gTree(g,at);
    (spc.commits||[]).forEach(cm=>{
      Object.keys(cm.f||{}).forEach(f=>{ if(cm.f[f]==null) delete t2[f]; else t2[f]=cm.f[f]; });
      const id=gCommit(g,cm.m,[gHeadId(g)],t2); g.b[n]=id;
    });
    g.H=save;
  });
  if(spec.checkout && g.b[spec.checkout]!=null) g.H={t:"b",n:spec.checkout};
  const T=gHeadTree(g); g.idx=gClone(T); g.wd=gClone(T);
  if(spec.wd) Object.keys(spec.wd).forEach(f=>{ if(spec.wd[f]==null) delete g.wd[f]; else g.wd[f]=spec.wd[f]; });
  if(spec.remote){ g.remote={}; Object.keys(spec.remote).forEach(b=>{
    const v=spec.remote[b]; g.remote[b]= typeof v==="number" ? ids[v] : g.b[v];
    g.rb["origin/"+b]=g.remote[b]; }); }
  if(spec.detached) g.H={t:"d", id:gResolve(g,spec.detached)};
  return g;
}

function gNoConflictMarks(g){ return gFiles(gHeadTree(g)).every(f=>!/<<<<<<<|>>>>>>>/.test(gHeadTree(g)[f])); }
function gCommitCount(g,id){ return gLogList(g, id==null?gHeadId(g):id).length; }
function gMsgs(g,id){ return gLogList(g, id==null?gHeadId(g):id).map(c=>c.msg); }
function gHasMerge(g,id){ return gLogList(g, id==null?gHeadId(g):id).some(c=>c.par.length>1); }

/* ===== Git 시뮬레이터 UI (PRD §25) ===== */
let GL=null;    // {mi, g, file, msgs}
function glState(){ if(!S.git) S.git={done:{}}; if(!S.git.done) S.git.done={}; return S.git; }
function glDoneCount(){ const d=glState().done; return GIT_MISSIONS.filter(m=>d[m.id]).length; }
function openGitLab(){
  const o=$("gitlab"); o.classList.add("on"); document.body.style.overflow="hidden";
  try{history.pushState({cr:1},"")}catch(e){}
  glRenderList();
}
function closeGitLab(){ $("gitlab").classList.remove("on"); document.body.style.overflow=""; GL=null;
  if(typeof renderCourse==="function") renderCourse(); }
function glRenderList(){
  GL=null;
  $("gl-name").textContent="Git 시뮬레이터";
  $("gl-prog").textContent=glDoneCount()+" / "+GIT_MISSIONS.length+" 미션 완료";
  $("gl-menu").style.display="none";
  const d=glState().done;
  const cards=GIT_MISSIONS.map((m,i)=>
    '<button class="glm'+(d[m.id]?" done":"")+'" data-i="'+i+'">'+
    '<span class="gm-em">'+m.em+'</span><span class="gm-m"><span class="gm-t">'+(i+1)+'. '+escHtml(m.title)+'</span>'+
    '<span class="gm-s">'+escHtml(m.brief.slice(0,70))+(m.brief.length>70?"…":"")+'</span></span>'+
    '<span class="gm-go">'+(d[m.id]?"✓":"→")+'</span></button>').join("");
  $("gl-body").innerHTML=
    '<div class="gl-brief"><b>🐙 진짜로 동작하는 Git</b>'+
    '<p>명령을 입력하면 커밋·브랜치·병합이 실제로 계산됩니다. 충돌도 진짜로 나고, 직접 해결해야 넘어갑니다. '+
    'reset·revert·rebase 를 언제 쓰는지 손으로 익히는 것이 목표입니다.</p></div>'+
    '<div class="gl-h">미션</div>'+cards;
  $("gl-body").querySelectorAll(".glm").forEach(b=>b.onclick=()=>glStart(+b.dataset.i));
  $("gl-body").scrollTop=0;
}
function glStart(i){
  const m=GIT_MISSIONS[i];
  GL={mi:i, g:gInit(m.setup||{}), file:null, log:[]};
  glLog("$ (미션 시작) git status 로 현재 상태를 확인해 보세요", "cin");
  glRender();
}
function glLog(text, cls){ if(!GL) return; GL.log.push({t:text, c:cls||""}); if(GL.log.length>200) GL.log.shift(); }
function glMission(){ return GIT_MISSIONS[GL.mi]; }
function glGraph(g){
  const list=gLogList(g, gHeadId(g)).slice(0,7);
  if(!list.length) return '<div class="gl-graph"><span class="gid">아직 커밋이 없습니다.</span></div>';
  return '<div class="gl-graph">'+list.map(c=>
    '<div class="gc"><span class="gd">'+(c.par.length>1?"◆":"●")+'</span>'+
    '<span class="gid">'+c.id+'</span><span>'+escHtml(c.msg)+'</span>'+
    (gRefsAt(g,c.id)?'<span class="gr">'+escHtml(gRefsAt(g,c.id).trim())+'</span>':"")+'</div>').join("")+
    (gLogList(g,gHeadId(g)).length>7?'<div class="gc"><span class="gid">⋮ 이전 커밋 '+(gLogList(g,gHeadId(g)).length-7)+'개</span></div>':"")+
    '</div>';
}
function glRender(){
  const m=glMission(), g=GL.g;
  const met=!!m.goal(g);
  if(met && !glState().done[m.id]){
    glState().done[m.id]=true; S.xp+=40; save();
    if(typeof awardSkill==="function"){ awardSkill("coding",3); awardSkill("communication",2); save(); }
    if(typeof toast==="function") toast("미션 완료 · +40 XP 🎉");
    if(typeof checkAchv==="function") checkAchv(true);
    if(typeof paintStats==="function") paintStats();
  }
  $("gl-name").textContent=(GL.mi+1)+". "+m.title;
  $("gl-prog").textContent=glDoneCount()+" / "+GIT_MISSIONS.length+" 미션 완료";
  $("gl-menu").style.display="";
  const st=gStatus(g);
  const files=[...new Set([...gFiles(g.wd), ...gFiles(gHeadTree(g))])];
  const fileBtns=files.map(f=>{
    const dirty=g.wd[f]!==g.idx[f];
    return '<button class="'+(GL.file===f?"sel ":"")+(dirty?"dirty":"")+'" data-f="'+escHtml(f)+'">'+escHtml(f)+'</button>';
  }).join("")+'<button class="nw" data-new="1">＋ 새 파일</button>';
  const branchChips=Object.keys(g.b).sort().map(n=>
    '<span class="'+(g.H.t==="b"&&g.H.n===n?"head":"")+'">'+escHtml(n)+'</span>').join("")+
    Object.keys(g.rb).sort().map(n=>'<span class="rem">'+escHtml(n)+'</span>').join("")+
    (g.H.t==="d"?'<span class="head">detached HEAD</span>':"");
  const ed = GL.file!=null ? (
    '<div class="gl-ed"><textarea id="gl-txt" spellcheck="false">'+escHtml(g.wd[GL.file]==null?"":g.wd[GL.file])+'</textarea>'+
    '<div class="row"><button class="pri" id="gl-save">저장</button>'+
    '<button id="gl-del">파일 삭제</button><button id="gl-cancel">닫기</button></div></div>') : "";
  $("gl-body").innerHTML=
    '<div class="gl-brief"><b>'+m.em+' '+escHtml(m.title)+'</b><p>'+escHtml(m.brief)+'</p>'+
      (m.pre?'<p style="font-size:12.5px;opacity:.8">💡 '+escHtml(m.pre)+'</p>':"")+
      '<div class="gl-goal'+(met?" met":"")+'">'+(met?"✅ 달성 — ":"🎯 목표 — ")+escHtml(m.goalTxt)+'</div>'+
      '<details class="gl-teach"><summary>📖 이 명령이 무엇을 하는가</summary><p>'+thText(m.teach)+'</p></details>'+
    '</div>'+
    '<div class="gl-h">저장소 상태 · '+(g.H.t==="b"?("On branch "+escHtml(g.H.n)):"detached HEAD")+
      (st.clean?" · 깨끗함":" · 변경 있음")+(g.ms?" · 병합 충돌 해결 중":"")+(g.rs?" · 리베이스 진행 중":"")+'</div>'+
    '<div class="gl-panel"><div class="gl-refs">'+branchChips+'</div>'+glGraph(g)+'</div>'+
    '<div class="gl-h">작업 디렉터리 <span style="font-weight:700">(● = 스테이지와 다름)</span></div>'+
    '<div class="gl-panel"><div class="gl-files" id="gl-files">'+fileBtns+'</div>'+ed+'</div>'+
    '<div class="gl-h">터미널</div>'+
    '<div class="gl-term"><div class="gl-out" id="gl-out">'+
      GL.log.map(l=>'<div class="'+l.c+'">'+escHtml(l.t)+'</div>').join("")+
    '</div><div class="gl-in"><span>$</span><input id="gl-cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="git status" /></div></div>'+
    '<div class="gl-act">'+
      '<button id="gl-hint">💡 힌트</button>'+
      '<button id="gl-reset">처음부터</button>'+
      (met&&GL.mi+1<GIT_MISSIONS.length?'<button class="pri" id="gl-next">다음 미션 →</button>':"")+
      (met&&GL.mi+1>=GIT_MISSIONS.length?'<button class="pri" id="gl-done">전부 완료 🎉</button>':"")+
    '</div>'+
    (met?'<div class="gl-win">🎉 '+escHtml(m.title)+' 완료 — '+escHtml(m.goalTxt)+'</div>':"");
  const out=$("gl-out"); if(out) out.scrollTop=out.scrollHeight;
  $("gl-files").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(b.dataset.new){ const n=prompt("새 파일 이름"); if(!n) return;
      if(GL.g.wd[n]==null) GL.g.wd[n]=""; GL.file=n; glRender(); return; }
    GL.file = GL.file===b.dataset.f ? null : b.dataset.f; glRender();
  });
  const sv=$("gl-save");
  if(sv){ sv.onclick=()=>{ GL.g.wd[GL.file]=$("gl-txt").value; glLog("(편집) "+GL.file+" 저장됨","cin"); glRender(); };
    $("gl-del").onclick=()=>{ delete GL.g.wd[GL.file]; glLog("(편집) "+GL.file+" 삭제됨","cin"); GL.file=null; glRender(); };
    $("gl-cancel").onclick=()=>{ GL.file=null; glRender(); }; }
  const inp=$("gl-cmd");
  inp.onkeydown=e=>{ if(e.key!=="Enter") return;
    const line=inp.value.trim(); if(!line) return;
    glLog("$ "+line,"cin");
    const r=gitRun(GL.g, line);
    (r.out||[]).forEach(x=>String(x).split("\n").forEach(y=>glLog(y, r.err?"cerr":"")));
    inp.value=""; glRender(); setTimeout(()=>{ const i2=$("gl-cmd"); if(i2) i2.focus(); },0);
  };
  $("gl-hint").onclick=()=>{ glLog("💡 "+m.hint,""); glRender(); };
  $("gl-reset").onclick=()=>{ glStart(GL.mi); };
  const nx=$("gl-next"); if(nx) nx.onclick=()=>glStart(GL.mi+1);
  const dn=$("gl-done"); if(dn) dn.onclick=glRenderList;
}

/* ===== 학습 이력 기록 — 코치·미션·업적의 원천 (PRD §19·§37) ===== */
function histToday(){ if(!S.hist) S.hist={}; const t=today();
  const h=S.hist[t]||(S.hist[t]={q:0,ok:0,rev:0,impl:0,les:0});
  const ks=Object.keys(S.hist); if(ks.length>140){ ks.sort(); ks.slice(0,ks.length-140).forEach(k=>delete S.hist[k]); }
  return h; }
function qCat(q){ if(!q) return "knowledge";
  if(q.cat) return q.cat;
  if(q.t==="code"||q.t==="py"||q.t==="sql"||q.t==="html"||q.t==="react"||q.t==="ts"||q.t==="sim"||q.t==="arch") return "impl";
  if(q.t==="log") return "logs";
  if(q.t==="review") return "review";
  return "knowledge"; }
function logAnswer(ok,q){
  const hs=histToday(); hs.q++; if(ok) hs.ok++;
  S.qTotal=(S.qTotal|0)+1; if(ok) S.okTotal=(S.okTotal|0)+1;
  const ut=(run&&run.lang&&COURSES[run.lang])?COURSES[run.lang].units.length:0;
  const lv=qLevel(q, run?run.ui:null, ut);
  if(!S.lvN)S.lvN={}; if(!S.lvOk)S.lvOk={}; if(!S.catN)S.catN={}; if(!S.catOk)S.catOk={}; if(!S.trkN)S.trkN={};
  S.lvN[lv]=(S.lvN[lv]||0)+1; if(ok) S.lvOk[lv]=(S.lvOk[lv]||0)+1;
  const ck=qCat(q);
  S.catN[ck]=(S.catN[ck]||0)+1; if(ok) S.catOk[ck]=(S.catOk[ck]||0)+1;
  if(ok && (q.t==="code"||q.t==="py"||q.t==="sql"||q.t==="html"||q.t==="react"||q.t==="ts"||q.t==="sim"||q.t==="arch")) hs.impl++;
  if(run&&run.lang) S.trkN[run.lang]=(S.trkN[run.lang]||0)+1;
  /* 근거 기록: 트랙별 + 9축별 */
  /* 인출: 보기를 감춘 채 스스로 꺼냈는가 (선택형에만 해당) */
  if(run && run.rcDone && recallOn(q)){
    if(!S.rc) S.rc={n:0, ok:0};
    S.rc.n++; if(run.rcHit) S.rc.ok++;
    if(run.lang){ const tb=evBucket("trk", run.lang);
      if(!tb.rc) tb.rc={n:0,ok:0}; tb.rc.n++; if(run.rcHit) tb.rc.ok++; }
  }

function coachLines(){
  const out=[]; const r14=recentHist(14), r7=r14.slice(7);
  const q7=r7.reduce((s,x)=>s+x.q,0), ok7=r7.reduce((s,x)=>s+x.ok,0);
  const qPrev=r14.slice(0,7).reduce((s,x)=>s+x.q,0);
  const days7=r7.filter(x=>x.q>0).length;
  const accAll=accPct(S.okTotal|0, S.qTotal|0), acc7=accPct(ok7,q7);
  if((S.qTotal|0)<20) return ["아직 데이터가 적어요. 20문제쯤 풀면 난이도·유형별로 어디가 약한지 짚어드릴 수 있습니다."];
  if(days7===0) out.push("최근 7일 학습 기록이 없습니다. 하루 10문제(5분)만 다시 시작해도 흐름은 금방 돌아옵니다.");
  else out.push("최근 7일에 "+days7+"일 학습했고 "+q7+"문제를 풀었습니다"+(qPrev?(" (직전 7일 "+qPrev+"문제 대비 "+(q7>=qPrev?"+":"")+(q7-qPrev)+")"):"")+".");
  if(acc7!=null&&accAll!=null){
    if(acc7>=accAll+6) out.push("정답률이 전체 "+accAll+"%에서 최근 "+acc7+"%로 올랐습니다. 난이도를 한 단계 올릴 때입니다 — 실무·시니어 태그 문제를 섞으세요.");
    else if(acc7<=accAll-8) out.push("최근 정답률 "+acc7+"%로 전체 "+accAll+"%보다 낮습니다. 어려운 구간에 들어섰다는 뜻이니, 새 진도보다 오답 복습 비중을 올리세요.");
    else out.push("정답률은 전체 "+accAll+"%, 최근 "+acc7+"%로 안정적입니다.");
  }
  // 난이도 구간 진단
  const lv=[]; for(let i=1;i<=5;i++){ const n=(S.lvN&&S.lvN[i])|0; if(n>=8) lv.push({i,n,p:accPct((S.lvOk&&S.lvOk[i])|0,n)}); }

    const top=lv.filter(x=>x.i>=4);
    if(!top.length) out.push("아직 실무·시니어 난이도 문제를 거의 풀지 않았습니다. 트랙 뒤쪽 유닛과 직접 코딩·디버깅으로 넘어갈 때입니다.");

  const CN={knowledge:"개념",impl:"직접 구현",debug:"디버깅",review:"코드 리뷰",design:"설계",ops:"실무 판단",perf:"성능",internals:"내부 동작",security:"보안",interview:"면접",logs:"로그 분석"};
  const cats=[]; for(const k in (S.catN||{})){ const n=S.catN[k]|0; if(n>=6) cats.push({k,n,p:accPct((S.catOk&&S.catOk[k])|0,n)}); }
  if(cats.length>=2){ cats.sort((a,b)=>a.p-b.p);
    const lo=cats[0], hi=cats[cats.length-1];
    const hn=CN[hi.k]||hi.k, ln=CN[lo.k]||lo.k;
    if(hi.p-lo.p>=15) out.push("유형별로 보면 "+hn+"("+hi.p+"%)"+(hasJong(hn)?"은":"는")+" 강하고 "+ln+"("+lo.p+"%)"+(hasJong(ln)?"이":"가")+" 약합니다. 약한 유형을 의도적으로 더 뽑아 푸세요.");

  return out;

/* 받침에 따라 조사 선택 — "시스템 설계을(를)" 같은 표기를 없앤다 */
function hasJong(s){ s=String(s==null?"":s); if(!s) return false;
  const ch=s.charCodeAt(s.length-1);
  if(ch>=0xAC00&&ch<=0xD7A3) return (ch-0xAC00)%28!==0;
  const c=s[s.length-1].toLowerCase();
  return "lmn".indexOf(c)>=0;            // 엘·엠·엔은 받침이 있다
}
function jos(s,withJ,noJ){ return String(s==null?"":s)+(hasJong(s)?withJ:noJ); }

const QLV=[null,{n:"입문",e:"🟢"},{n:"기초",e:"🔵"},{n:"응용",e:"🟡"},{n:"실무",e:"🟠"},{n:"시니어",e:"🔴"}];
function qLevel(q,ui,utotal){
  if(q&&typeof q.d==="number") return Math.max(1,Math.min(5,q.d|0));
  let b=(typeof ui==="number"&&utotal)?unitLevel(ui,utotal):3;
  const t=(q&&q.t)||"choice", cat=q&&q.cat;
  let bonus=0;                                  // 유형·범주 보너스는 중첩하지 않고 큰 쪽 하나만
  if(t==="review") bonus=2;
  else if(t==="code"||t==="py"||t==="sql") bonus=1;
  if(t==="log") bonus=Math.max(bonus,2);
  if(cat==="debug"||cat==="logs"||cat==="design"||cat==="ops"||cat==="internals"||cat==="perf"||cat==="interview") bonus=Math.max(bonus,1);
  return Math.max(1,Math.min(5,b+bonus));
}

function recoPick(){
  ensureSkills();
  const due=(typeof dueCount==="function")?dueCount():0;
  if(due>0) return {kind:"srs", n:due};
  const doneN=Object.keys(S.done||{}).length;
  if(doneN===0) return {kind:"start"};
  const vals=AXES.map(a=>({ax:a.k,v:S.skills[a.k]||0}));
  const avg=vals.reduce((s,x)=>s+x.v,0)/vals.length;
  const cand=vals.filter(x=>{ const rm=AXIS_REMEDY[x.ax]; return rm&&((rm.tracks||[]).some(t=>COURSES[t])||rm.action); });
  cand.sort((a,b)=>a.v-b.v);
  const low=cand[0];
  if(!low) return {kind:"keep"};
  if(low.v>=avg-3 && low.v>=45) return {kind:"keep", ax:low.ax, v:low.v, avg};
  return {kind:"axis", ax:low.ax, v:low.v, avg};
}

/* ---- 오답노트 (실습실) ---- */
function wKey(q){ return (q.q||"")+"|"+(q.code||"")+"|"+(q.o?q.o.join("~"):""); }
/* ── 간격 반복 (Leitner SRS): 맞히면 다음 상자로 승급(복습 간격 늘어남), 틀리면 리셋 ── */
const SRS_DAYS=[1,3,7,16,35,90];
function srsAddDays(d,n){ try{ const t=new Date((d||today())+"T00:00:00"); t.setDate(t.getDate()+n); return t.toISOString().slice(0,10); }catch(e){ return today(); } }
function srsDue(w,t){ return !w.due || w.due<=(t||today()); }
function dueCount(){ if(!Array.isArray(S.wrongs))return 0; const t=today(); return S.wrongs.filter(w=>srsDue(w,t)).length; }
function recordWrong(lang,q){
  if(!Array.isArray(S.wrongs)) S.wrongs=[];
  const k=wKey(q);
  const ex=S.wrongs.find(w=>wKey(w.q)===k);
  if(ex){ ex.box=0; ex.due=today(); }          // 다시 틀림 → 상자 0으로 리셋
  else { S.wrongs.push({lang,q,box:0,due:today()}); if(S.wrongs.length>200) S.wrongs.shift(); }
  save(); paintReview();
}
function srsPromote(q){                         // 복습에서 맞힘 → 다음 상자로 승급
  if(!Array.isArray(S.wrongs)) return;
  const k=wKey(q); const w=S.wrongs.find(x=>wKey(x.q)===k); if(!w) return;
  w.box=(w.box||0)+1;
  histToday().rev++;
  if(w.box>=SRS_DAYS.length){ S.wrongs=S.wrongs.filter(x=>wKey(x.q)!==k); }  // 졸업 → 노트에서 제거
  else { w.due=srsAddDays(today(), SRS_DAYS[w.box-1]); }
  save(); paintReview();
}
function paintReview(){
  const b=$("review-btn"); if(!b) return;
  const n=Array.isArray(S.wrongs)?S.wrongs.length:0, due=dueCount();
  b.innerHTML=`오답노트${due?`<span class="badge">${due}</span>`:(n?`<span class="badge" style="background:var(--line-strong)">${n}</span>`:"")}`;
}
function startReview(){
  if(!Array.isArray(S.wrongs)||!S.wrongs.length){
    toast("오답노트가 아직 비어 있어요. 틀린 문제가 여기 모이면 간격 반복으로 다시 풀 수 있어요."); return; }
  const t=today();
  const dueItems=S.wrongs.filter(w=>srsDue(w,t));
  const pool=dueItems.length?dueItems:S.wrongs.slice();   // 복습 기한 지난 것 우선, 없으면 전체
  const picked=shuffle(pool.slice()).slice(0,15).map(w=>w.q);
  const les={title:dueItems.length?"오늘 복습 (간격 반복)":"오답노트 복습",xp:10,q:picked};
  run={lang:curLang,les,i:0,correct:0,total:picked.length,hearts:S.hearts,id:null,color:"#e0533d",free:true,review:true};
  openRun();
}
/* 개념(이론) → 문제. 레슨에 theory가 있고 첫 문제 직전이면 개념 화면을 먼저 보여준다. */
function thText(s){ s=escHtml(s);
  s=s.replace(/`([^`]+)`/g,'<code class="ic">$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  return nl2br(s);
}
function renderTheory(th){
  if(!th) return "";
  if(typeof th==="string") return `<p class="th-p">${thText(th)}</p>`;
  let h="";
  if(th.sum) h+=`<div class="th-sum">${thText(th.sum)}</div>`;
  (th.body||[]).forEach(b=>{ if(b.h)h+=`<h3 class="th-h">${thText(b.h)}</h3>`; if(b.t)h+=`<p class="th-p">${thText(b.t)}</p>`; });
  if(th.code&&th.code.c){ h+=C(escHtml(th.code.c)); if(th.code.cap)h+=`<p class="th-cap">${thText(th.code.cap)}</p>`; }
  if(Array.isArray(th.key)&&th.key.length){ h+=`<div class="th-key"><div class="th-key-t">✓ 기억할 점</div><ul>`+th.key.map(k=>`<li>${thText(k)}</li>`).join("")+`</ul></div>`; }
  return h;
}

/* 고정 하단 바가 본문 끝을 가리지 않도록 여백을 실측해서 맞춘다 */
function syncFootPad(){

  const hgt=f.offsetHeight||0;
  document.documentElement.style.setProperty("--footh", hgt+"px");

function markCodeOverflow(){
  const b=$("qbody"); if(!b) return;
  b.querySelectorAll("pre.code").forEach(pre=>{
    const ov=pre.scrollWidth>pre.clientWidth+4;
    const par=pre.parentElement;
    if(ov && par && !par.classList.contains("codewrap")){
      const w=document.createElement("div"); w.className="codewrap";
      pre.replaceWith(w); w.appendChild(pre);
    }
  });
}
function updScrollHint(){
  const b=$("qbody"), el=$("scrollhint"); if(!b||!el) return;
  const rest=b.scrollHeight-b.clientHeight-b.scrollTop;

   nil 인터페이스가 명세와 다르다. 틀린 결과를 가르치느니 진짜 컴파일러를 옆에서 돌린다.
   tools/runner/server.cjs 를 켜고 주소를 넣으면 실행 버튼이 열린다. 안 켜도 나머지는 그대로 동작한다. */
const RUN_LANGS={java:"java", c:"c", cpp:"cpp", go:"go", rust:"rust"};
const RUN_LABEL={java:"Java", c:"C", cpp:"C++", go:"Go", rust:"Rust"};
function runnerCfg(){ if(!S.runner) S.runner={url:""}; return S.runner; }
function runnerReady(){ return !!(runnerCfg().url||"").trim(); }
function runnerBase(){ return (runnerCfg().url||"").trim().replace(/\/+$/,""); }
function runnerHealth(){
  if(!runnerReady()) return Promise.resolve({ok:false, error:"주소가 설정되지 않았어요"});
  return fetch(runnerBase()+"/health").then(r=>r.json()).catch(e=>({ok:false, error:String(e.message||e)}));

function runnerRun(lang, source, stdin){
  if(!runnerReady()) return Promise.resolve({error:"실행 서버 주소가 설정되지 않았어요"});
  return fetch(runnerBase()+"/run",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({lang:lang, source:source, stdin:stdin||""})})
    .then(r=>r.json())
    .catch(e=>({error:"실행 서버에 연결하지 못했어요 ("+String(e.message||e)+")"}));
}
/* 러너로 채점한다 — 테스트를 우리 형식으로 번역하지 않고 그 언어의 테스트 러너에 맡긴다.
   go test · cargo test · gcc/g++ 링크 실행. 러너가 없으면 채점하지 않고 그렇게 알린다. */
function runnerTest(lang, code, test){
  if(!runnerReady()) return Promise.resolve({needRunner:true});
  return fetch(runnerBase()+"/test",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({language:lang, code:code, test:test})})
    .then(r=>r.json())
    .catch(e=>({error:"실행 서버에 연결하지 못했어요 ("+String(e.message||e)+")"}));
}
/* 문항의 코드 조각을 그 언어의 완전한 프로그램으로 감싼다. 이미 main 이 있으면 그대로 둔다. */
function wrapForRun(lang, code){
  const c=String(code||"");
  if(lang==="java"){
    if(/class\s+Main\b/.test(c)) return c;
    if(/public\s+static\s+void\s+main\b/.test(c)) return "public class Main {\n"+c+"\n}\n";
    return "public class Main {\n  public static void main(String[] args) {\n"+
           c.split("\n").map(l=>"    "+l).join("\n")+"\n  }\n}\n";
  }
  if(lang==="c"||lang==="cpp"){
    const heads = lang==="c" ? "#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n"
                             : "#include <iostream>\n#include <vector>\n#include <string>\n#include <algorithm>\n";
    if(/\bint\s+main\s*\(/.test(c)) return (/#include/.test(c)? "" : heads)+c;
    return heads+"int main(void) {\n"+c.split("\n").map(l=>"  "+l).join("\n")+
           "\n  return 0;\n}\n";
  }
  if(/func\s+main\s*\(/.test(c)) return (/^\s*package\s/.test(c)? "" : "package main\n\n")+c;
  return "package main\n\nimport \"fmt\"\n\nvar _ = fmt.Sprint\n\nfunc main() {\n"+
         c.split("\n").map(l=>"\t"+l).join("\n")+"\n}\n";
}

/* ===== 진도 키: 유닛/레슨 '제목' 기반 안정 ID =====
   기존 키는 reorderUnits() 이후의 배열 인덱스였다. 유닛을 하나만 추가해도
   정렬 결과가 밀려 완료 기록이 엉뚱한 레슨으로 옮겨갔다. */
function h32(s){ let x=5381; for(let i=0;i<s.length;i++) x=((x*33)^s.charCodeAt(i))>>>0; return x.toString(36); }
function lkey(lang,ui,li){

  if(!l) return lang+"-"+ui+"-"+li;                 // 못 찾으면 옛 형식 유지
  return lang+":"+h32(u.title+"  "+l.title);
}

function migrateDone(){
  if(!S.done) S.done={};
  if(S.doneV===2) return;
  const out={}; let moved=0, kept=0;
  for(const k in S.done){
    const m=/^([a-z]+)-(\d+)-(\d+)$/.exec(k);
    if(!m){ out[k]=S.done[k]; kept++; continue; }
    const nk=lkey(m[1], +m[2], +m[3]);
    if(nk===k){ out[k]=S.done[k]; kept++; }          // 매핑 실패 → 원본 보존
    else { out[nk]=S.done[k]; moved++; }
  }
  S.done=out; S.doneV=2; save();
  return {moved, kept};
}



/* ===== 인출 모드 =====
   재인(보기 중 고르기)과 인출(스스로 꺼내기)은 다른 능력이고, 실무에 쓰이는 쪽은 인출이다.
   선택형 문항도 보기를 먼저 감추면 인출 훈련이 된다. 채점은 보수적으로만 인정한다 —
   맞혔는데 못 알아보는 건 괜찮지만, 틀렸는데 맞다고 해주면 훈련이 망가진다. */
function rcTokens(s){
  return String(s==null?"":s).toLowerCase()
    .replace(/<[^>]*>/g," ")
    .replace(/[^0-9a-z가-힣_+#.]+/g," ")
    .split(/\s+/).filter(t=>t.length>=2);
}
function rcCover(ans, opt){
  const A=new Set(rcTokens(ans)), O=rcTokens(opt);
  if(!O.length) return 0;
  let hit=0; O.forEach(t=>{ if(A.has(t)) hit++; });
  return hit/O.length;
}
function rcSim(ans, opt){                       // 대칭 유사도 — 짧은 오답이 부분집합이라고 이기지 못하게
  const A=new Set(rcTokens(ans)), O=new Set(rcTokens(opt));
  if(!A.size || !O.size) return 0;
  let inter=0; O.forEach(t=>{ if(A.has(t)) inter++; });
  return inter/(A.size+O.size-inter);
}
function gradeRecall(q, text){
  if(!q || !Array.isArray(q.o) || typeof q.a!=="number") return {hit:false};
  if(!rcTokens(text).length) return {hit:false};
  const target=rcTokens(q.o[q.a]);
  const cover=rcCover(text, q.o[q.a]);          // 정답의 핵심어를 얼마나 짚었나 (길게 써도 손해 없음)
  const need = target.length<=3 ? 1 : 0.6;      // 짧은 답은 사실상 정확히 적어야 인정
  const mine=rcSim(text, q.o[q.a]);
  let rival=0; q.o.forEach((o,i)=>{ if(i!==q.a){ const v=rcSim(text,o); if(v>rival) rival=v; } });
  return {hit: cover>=need && mine>rival+0.08, cover, sim:mine, rival};
}
function recallOn(q){ return S.recall!==false && (q.t||"choice")==="choice" && Array.isArray(q.o) && q.o.length>1; }

/* ===== 역량 점수: 활동량이 아니라 '응답 근거'로 계산 =====
   이전 방식은 문제를 누를 때마다 점수가 오르기만 했다. 그러면 점수는 실력이 아니라
   사용량을 뜻하게 된다. 이제는 최근 정답률·어려운 문항 정답률·구현 통과율·표본 크기로
   매번 다시 계산하고, 무엇을 근거로 그 점수가 나왔는지 화면에 그대로 보여준다. */
const EV_RECENT=50;          // 최근 정답률 표본
const EV_MIN=10;             // 이 미만이면 점수를 말하지 않는다
const EV_FULL=150;           // 커버리지 만점 기준 문항 수
function evBucket(store, key){
  if(!S[store]) S[store]={};
  const b=S[store][key]||(S[store][key]={n:0, ok:0, lv:{}, impl:{n:0,ok:0}, recent:[]});
  if(!b.lv) b.lv={}; if(!b.impl) b.impl={n:0,ok:0}; if(!Array.isArray(b.recent)) b.recent=[];
  return b;
}
function evRecord(b, ok, lv, isImpl){
  b.n++; if(ok) b.ok++;
  const L=b.lv[lv]||(b.lv[lv]={n:0,ok:0}); L.n++; if(ok) L.ok++;
  if(isImpl){ b.impl.n++; if(ok) b.impl.ok++; }
  b.recent.push(ok?1:0); if(b.recent.length>EV_RECENT) b.recent.shift();
}
function evScore(b){
  if(!b || b.n<EV_MIN) return null;
  const recent = b.recent.length ? b.recent.reduce((a,x)=>a+x,0)/b.recent.length : b.ok/b.n;
  let hardN=0, hardOk=0;
  [3,4,5].forEach(l=>{ const L=b.lv[l]; if(L){ hardN+=L.n; hardOk+=L.ok; } });
  const hard = hardN>=8 ? hardOk/hardN : null;
  const impl = b.impl.n>=3 ? b.impl.ok/b.impl.n : null;
  const cover = Math.min(1, b.n/EV_FULL);
  // 어려운 문항 근거가 없으면 크게 할인한다 — 쉬운 문제만 100% 맞힌 사람이 높게 나오면 안 된다
  const hardTerm = hard==null ? recent*0.55 : hard;
  const implTerm = impl==null ? 0 : impl;
  const base = 0.45*recent + 0.35*hardTerm + 0.20*implTerm;
  return Math.round(100 * base * (0.55 + 0.45*cover));
}
function evLines(b, label){
  if(!b || !b.n) return ["아직 근거가 없습니다."];
  const out=[];
  out.push("문제 " + b.n + "개 풀이" + (label?(" · "+label):""));
  if(b.recent.length) out.push("최근 " + b.recent.length + "문제 정답률 " +
    Math.round(b.recent.reduce((a,x)=>a+x,0)/b.recent.length*100) + "%");
  let hn=0,hk=0; [3,4,5].forEach(l=>{ const L=b.lv[l]; if(L){ hn+=L.n; hk+=L.ok; } });
  if(hn) out.push("응용 이상 난이도 " + hn + "문제 중 " + Math.round(hk/hn*100) + "% 정답");
  else out.push("응용 이상 난이도 문제를 아직 풀지 않음");
  if(b.rc && b.rc.n>=5) out.push("보기 없이 스스로 답한 비율 " + Math.round(b.rc.ok/b.rc.n*100) + "% (" + b.rc.n + "문제 중 " + b.rc.ok + ")");
  if(b.impl.n) out.push("코드 작성·실행 " + b.impl.n + "회 중 " + b.impl.ok + "회 테스트 통과");
  else out.push("코드 작성 문제 기록 없음");
  return out;
}
/* 시뮬·진단·프로젝트의 판단은 문항이 아니므로 별도 근거로 센다 */
function evJudge(ax, good){
  if(!S.axj) S.axj={};
  const j=S.axj[ax]||(S.axj[ax]={n:0, good:0});
  j.n++; if(good) j.good++;
}
function axisScore(ax){
  const base=evScore(S.ax&&S.ax[ax]);
  const j=(S.axj&&S.axj[ax])||{n:0,good:0};
  const jb=Math.min(12, j.good*1.5);
  if(base==null){
    if(j.n===0){
      const lg=S.skillsLegacy&&S.skillsLegacy[ax];
      return {v: lg?Math.round(lg):0, est:!!lg};       // 근거 없음 → 이전 값을 '추정'으로 표기
    }
    return {v: Math.round(Math.min(30, jb*2)), est:true};
  }
  return {v: Math.min(100, Math.round(base+jb)), est:false};
}
function recomputeSkills(){
  ensureSkills();

}
function trackScore(lang){ return evScore(S.trk&&S.trk[lang]); }

function wirePhase(ph,isLast){

  if(ph.type==="web"){

function runChecks(ph){

      else if(c.k==="text") ok=!!(doc&&((doc.body&&doc.body.innerText)||"").includes(c.has));

    if(!ok) all=false;

/* 유닛을 난이도 오름차순으로 재정렬 — 입문 → 중급 → 심화 → 직접 코딩 (점점 어려워지게) */
function unitDiff(t){ t=t||"";
  if(/실행 채점|직접 코딩|직접 SQL|챌린지/.test(t)) return 95;   // 손으로 코딩 = 개념 학습 이후
  if(/코드 리뷰|로그 분석/.test(t)) return 85;                    // 남의 코드·로그 읽기 = 기초 이후
  if(/심화|시니어|스태프|Staff|Principal/.test(t)) return 90;
  if(/분산|내부|바이트코드|CPython|GIL|동시성|비동기|아키텍처|메모리 관리|메모리 관리와|최적화|프로파일|스케일|샤딩|복제|일관성|트랜잭션 격리|이벤트 루프|렌더링|V8|프로토타입|가비지|프로토콜|보안/.test(t)) return 72;
  if(/중급|전략|패턴|고차|데코레이터|제너레이터|클로저|정규표현식|타입힌트|매직 메서드|프로퍼티|이터레이터|복잡도|캐싱|벡터화|인덱스|조인|트랜잭션|테스트|디버깅|예외/.test(t)) return 48;
  if(/첫걸음|첫 걸음|입문|시작하기|하루/.test(t)) return 0;      // 절대 입문 = 맨 앞
  if(/기초|기본|변수|자료형|반복|다루기|조회|첫/.test(t)) return 14;
  return 30;
}
function reorderUnits(){ for(const k in COURSES){ const u=COURSES[k].units; if(!Array.isArray(u)||u.length<2) continue;
  const idx=u.map((x,i)=>[i,unitDiff(x.title)]); idx.sort((a,b)=> (a[1]-b[1]) || (a[0]-b[0]) );
  COURSES[k].units=idx.map(pr=>u[pr[0]]); } }
const ANSWER_FIX={};
const ANSWER_DROP=new Set(["아래데이터를mon순으로정렬했을때mon='mar'행에서lag(rev,1)이반환하는값은?\u0001--rows(mon,rev)--jan,100--feb,150--mar,120--apr,200lag(rev,1)over(orderbymon)"]);
function __afHelpers(){ function dc(s){let p;s=String(s==null?"":s);do{p=s;s=s.replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#0?39;/g,"'").replace(/&apos;/g,"'");}while(s!==p);return s;} function sc(c){let s=String(c||"");s=s.replace(/<br\s*\/?>/gi,"\n").replace(/<\/(div|p)>/gi,"\n").replace(/<[^>]+>/g,"");return dc(s);} return {nm:function(s){return dc(String(s||"")).replace(/\s+/g,"").toLowerCase();}, nc:function(c){return sc(c).replace(/\s+/g,"").toLowerCase();}}; }
function applyAnswerFixesFor(t){ try{ const H=__afHelpers(); var SEP="\u0001"; var c=COURSES[t]; if(!c)return;
  c.units.forEach(function(u){ u.lessons.forEach(function(l){ if(!Array.isArray(l.q))return;
    l.q=l.q.filter(function(q){ if(q.t!=="choice"&&q.t!=="input")return true;
      var k=H.nm(q.q)+SEP+H.nc(q.code||""); if(ANSWER_DROP.has(k))return false;
      if(q.t==="choice"&&(k in ANSWER_FIX))q.a=ANSWER_FIX[k]; return true; });
    /* 결함 문항을 빼면 목록에 표시할 개수도 함께 줄여야 한다 — 안 그러면 "5문항" 이라고
       써 놓고 4문항만 낸다 */
    if(typeof l.n==="number") l.n=l.q.length; }); }); }catch(e){} }
function applyAnswerFixes(){ for(var t in COURSES) if(COURSES[t]._loaded) applyAnswerFixesFor(t); }
